name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Add custom DownloadsSaver plugin
        run: |
          mkdir -p android/app/src/main/java/za/micollects/app
          cp android-ext/DownloadsSaverPlugin.java android/app/src/main/java/za/micollects/app/DownloadsSaverPlugin.java
          cp android-ext/MainActivity.java android/app/src/main/java/za/micollects/app/MainActivity.java

      - name: Generate app icon from resources/
        run: npx capacitor-assets generate --android

      - name: Use pinned debug keystore
        run: |
          mkdir -p ~/.android
          cp "$GITHUB_WORKSPACE/ci/debug.keystore" ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/miCollects.apk

      - uses: actions/upload-artifact@v4
        with:
          name: micollects-apk
          path: android/app/build/outputs/apk/debug/miCollects.apk
