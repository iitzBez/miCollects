<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<title>miCollects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--sunk:#F1F4F8;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --brass:#2563EB;--brass-ink:#FFFFFF;--wish:#2563EB;--danger:#DC2626;--scrim:rgba(15,23,42,.45);
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141C;--surface:#171D27;--sunk:#1F2632;--ink:#F1F5F9;--muted:#94A3B8;--line:#2A3342;
    --brass:#3B82F6;--brass-ink:#FFFFFF;--wish:#60A5FA;--danger:#F87171;--scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141C;--surface:#171D27;--sunk:#1F2632;--ink:#F1F5F9;--muted:#94A3B8;--line:#2A3342;
  --brass:#3B82F6;--brass-ink:#FFFFFF;--wish:#60A5FA;--danger:#F87171;--scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
img{max-width:100%}

/* Header */
.top{padding:20px 16px 6px;display:flex;align-items:flex-start;gap:12px;max-width:1100px;margin:0 auto}
.top-text{flex:1;min-width:0}
h1{font:800 clamp(30px,8vw,40px)/1.05 var(--display);letter-spacing:-.025em;margin:0}
#stats{margin:6px 0 0;color:var(--muted);font-size:14px;min-height:20px}
.brand{margin:0 0 6px;font:800 15px/1 var(--display);letter-spacing:-.01em;color:var(--ink)}
.brand span{color:var(--brass)}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn.syncing::after{content:"";position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 2px var(--surface);animation:syncPulse 1s ease-in-out infinite}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.icon-btn.syncing::after{animation:none}}
.icon-btn svg{width:20px;height:20px}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 4px;max-width:1100px;margin:0 auto}
.search{flex:1 1 100%;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid transparent;background:var(--sunk);padding:0 12px 0 38px}
.sort{height:44px;border-radius:12px;border:1px solid transparent;background:var(--sunk);padding:0 10px;flex:1 1 0;min-width:0}
.layout-bar{display:flex;gap:6px;padding:4px 16px 8px;max-width:1100px;margin:0 auto}
.lbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--muted)}
.lbtn svg{width:18px;height:18px}
.lbtn[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 4px;scrollbar-width:none;max-width:1100px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px calc(150px + env(safe-area-inset-bottom,0px));max-width:1100px;margin:0 auto}
.grid.cols-1{grid-template-columns:1fr}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.06);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left}
/* List view: a single row per item — image, name, price */
.grid.view-list{display:flex;flex-direction:column;gap:8px}
.grid.view-list .card{flex-direction:row;align-items:center;gap:12px}
.grid.view-list .ph{width:56px;height:56px;flex:none;border-radius:10px;aspect-ratio:auto}
.grid.view-list .qty{font-size:11px;padding:1px 6px;top:4px;right:4px}
.grid.view-list .cb{flex-direction:row;align-items:center;flex:1;min-width:0;padding:10px 12px 10px 0;gap:10px}
.grid.view-list .nm{flex:1;min-width:0;-webkit-line-clamp:1}
.grid.view-list .mt{display:none}
.grid.view-list .ft{margin-top:0;flex:none;gap:8px}
.grid.view-list .ft>span:first-child{display:none}
.grid.view-list .got{margin-top:0;width:auto;height:34px;padding:0 14px;flex:none}
.ph{aspect-ratio:1;background:var(--sunk);position:relative;display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.initial{font:800 56px/1 var(--display);color:var(--muted);opacity:.55}
.qty{position:absolute;top:8px;right:8px;background:var(--brass);color:var(--brass-ink);font-weight:700;font-size:13px;padding:2px 8px;border-radius:10px}
/* Wishlist items are drawn as empty slots: dashed outline, photo faded */
.card.wish .ph{background:transparent}
.card.wish .ph::after{content:"";position:absolute;inset:8px;border:2px dashed var(--wish);border-radius:10px;pointer-events:none}
.card.wish .ph img{filter:grayscale(1);opacity:.5}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-weight:650;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft{display:flex;justify-content:space-between;gap:6px;font-size:13px;margin-top:auto;padding-top:4px}
.ft .val{font-weight:650}
.pri{font-weight:600}
.pri.p3{color:var(--danger)}.pri.p2{color:#D97706}.pri.p1{color:var(--muted)}
.got{margin-top:8px;height:36px;border-radius:10px;border:0;color:var(--brass-ink);background:var(--brass);font-weight:650;font-size:14px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted)}
.empty h2{font:700 22px/1.2 var(--display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto 18px;max-width:34ch}
.group-head{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 2px 2px;padding-top:14px;border-top:1px solid var(--line);font:700 12px/1.2 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.group-head:first-child{margin-top:0;padding-top:0;border-top:0}
.group-count{font-weight:700;background:var(--sunk);border-radius:9px;padding:1px 7px;font-size:11px;text-transform:none;letter-spacing:0}

/* Bottom nav + add button */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;height:62px;border:0;background:transparent;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);position:relative;display:flex;align-items:center;justify-content:center;gap:6px}
.nav button[aria-selected="true"]{color:var(--brass)}
.nav button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brass)}
.nav .count{font-size:12px;font-weight:700;background:var(--sunk);border-radius:9px;padding:1px 7px;color:var(--muted)}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--brass);color:var(--brass-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(37,99,235,.35);z-index:6}
.fab svg{width:26px;height:26px}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));z-index:11;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font:700 24px/1.2 var(--display);letter-spacing:-.015em;margin:0 0 14px}
.sheet h3{font:700 17px/1.3 var(--display);margin:22px 0 6px}
.field{margin-bottom:14px;position:relative}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px}
.field textarea{resize:vertical;min-height:84px}
.ac-list{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.18);max-height:180px;overflow-y:auto;z-index:5}
.ac-list li{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.ac-list li:hover,.ac-list li.active{background:var(--sunk)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.hint.warn{color:var(--wish);font-weight:600}
.url-box{background:var(--sunk);border-radius:14px;padding:12px;margin-bottom:16px}
.url-box label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.url-row{display:flex;gap:8px}
.url-row input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
.url-row .btn{flex:none;padding:0 16px}
.url-box .hint a{color:var(--brass);font-weight:600}
.btn[disabled]{opacity:.6;cursor:progress}
.photo-main{aspect-ratio:16/10;border-radius:14px;background:var(--sunk);overflow:hidden;display:grid}
.photo-main img{width:100%;height:100%;object-fit:contain;display:block}
.photo-empty{display:grid;place-items:center;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-weight:600;cursor:pointer;margin-bottom:14px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 14px}
.thumb{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;position:relative;border:2px solid transparent;background:var(--sunk)}
.thumb.main{border-color:var(--brass)}
.thumb button[data-main]{all:unset;display:block;width:100%;height:100%;cursor:pointer}
.thumb button[data-main]:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(15,23,42,.72);color:#fff;font-size:14px;line-height:22px;padding:0;cursor:pointer}
.thumb.add{display:grid;place-items:center;border:2px dashed var(--line);color:var(--muted);font-size:26px;cursor:pointer}
.link{border:0;background:none;color:var(--danger);padding:4px 0 10px;cursor:pointer;font-size:14px;font-weight:600}
.link.plain{color:var(--brass)}
.actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 20px;border-radius:12px;font-weight:650;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--brass);color:var(--brass-ink);flex:1}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn svg{width:18px;height:18px;flex:none}
.cam-row{display:flex;gap:8px;margin-top:10px}
.cam-row .btn{flex:1}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.more{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.more .btn{flex:1}
.backup-text{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Welcome / sign-in splash (first launch only) */
.welcome{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center}
.welcome-logo{font:800 clamp(32px,10vw,44px)/1 var(--display);letter-spacing:-.03em;color:var(--ink);margin:0;animation:wlogo .6s ease-out}
.welcome-logo span{color:var(--brass)}
@keyframes wlogo{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.welcome-choices,.welcome-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;opacity:0;animation:wfade .4s ease-out forwards}
@keyframes wfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.welcome-form{text-align:left}
.welcome-form h2{font:700 22px/1.2 var(--display);margin:0 0 4px;text-align:center}
.welcome .btn{width:100%}
@media (prefers-reduced-motion:reduce){.welcome-logo,.welcome-choices,.welcome-form{animation:none;opacity:1}}
</style>
<script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-storage-compat.js"></script>
</head>
<body>

<div class="welcome" id="welcome" hidden>
  <p class="welcome-logo">mi<span>Collects</span></p>
  <div class="welcome-choices" id="welcomeChoices" hidden>
    <button type="button" class="btn primary" id="wSignIn">Sign in</button>
    <button type="button" class="btn ghost" id="wSignUp">Create account</button>
    <button type="button" class="link plain" id="wLocal">Use on this device only</button>
  </div>
  <div class="welcome-form" id="welcomeForm" hidden>
    <h2 id="wfTitle">Sign in</h2>
    <div class="field"><label for="wf-email">Email</label>
      <input id="wf-email" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label for="wf-pass">Password</label>
      <input id="wf-pass" type="password" autocomplete="current-password" placeholder="Password"></div>
    <button type="button" class="btn primary" id="wfSubmit">Sign in</button>
    <p class="hint" id="wfHint"></p>
    <button type="button" class="link plain" id="wfBack">Back</button>
  </div>
</div>

<header class="top">
  <div class="top-text">
    <p class="brand">mi<span>Collects</span></p>
    <h1 id="title">Collection</h1>
    <p id="stats"></p>
  </div>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<div class="toolbar">
  <label class="search">
    <span class="sr">Search</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search name, series, notes" autocomplete="off">
  </label>
  <label class="sr" for="sort">Sort by</label>
  <select id="sort" class="sort"></select>
  <label class="sr" for="group">Group by</label>
  <select id="group" class="sort"></select>
</div>
<div class="layout-bar" id="layoutBar" role="group" aria-label="Display layout">
  <button class="lbtn" type="button" data-layout="grid1" aria-label="1 tile per row" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="16" height="14" rx="2"/></svg></button>
  <button class="lbtn" type="button" data-layout="grid2" aria-label="2 tiles per row" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="7.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="7.5" height="14" rx="1.5"/></svg></button>
  <button class="lbtn" type="button" data-layout="grid3" aria-label="3 tiles per row" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2.5" y="5" width="5.3" height="14" rx="1.2"/><rect x="9.3" y="5" width="5.3" height="14" rx="1.2"/><rect x="16.2" y="5" width="5.3" height="14" rx="1.2"/></svg></button>
  <button class="lbtn" type="button" data-layout="list" aria-label="List view" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="6" height="6" rx="1"/><line x1="11" y1="8" x2="21" y2="8"/><rect x="3" y="14" width="6" height="6" rx="1"/><line x1="11" y1="17" x2="21" y2="17"/></svg></button>
</div>
<div class="chips" id="chips" role="toolbar" aria-label="Filter by category"></div>

<main class="grid" id="grid" aria-live="polite"></main>

<button class="fab" id="addBtn" aria-label="Add item">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="nav" role="tablist" aria-label="Lists">
  <button role="tab" data-tab="owned" aria-selected="true">Collection <span class="count" id="cOwned">0</span></button>
  <button role="tab" data-tab="wish" aria-selected="false">Wishlist <span class="count" id="cWish">0</span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab"></div>
  <div id="sheetBody"></div>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);

/* ---------- Storage (IndexedDB, falls back to memory) ---------- */
const store = {
  db: null, mem: new Map(),
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("cabinet", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("items", { keyPath: "id" });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);

    } catch (e) { this.db = null; }
  },
  os(mode) { return this.db.transaction("items", mode).objectStore("items"); },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  /* `scope` partitions items by account: "local" for guest/offline-only items, or a signed-in user's
     uid. Passing it filters to just that partition, so switching accounts (or signing out) only ever

  async put(it) { if (!this.db) { this.mem.set(it.id, it); return; } await this.req(this.os("readwrite").put(it)); },
  async del(id) { if (!this.db) { this.mem.delete(id); return; } await this.req(this.os("readwrite").delete(id)); },
  async clear() { if (!this.db) { this.mem.clear(); return; } await this.req(this.os("readwrite").clear()); }

  if (s < 60) return "just now";
  const m = Math.round(s / 60); if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h} hr ago`;
  const d = Math.round(h / 24); return `${d} day${d === 1 ? "" : "s"} ago`;

const UNGROUPED = /^(uncategorised|no brand|no series|not set)$/i;
function groupLabel(i, g) {
  if (g === "category") return i.category || "Uncategorised";
  if (g === "brand") return i.brand || "No brand";
  if (g === "series") return i.series || "No series";
  if (g === "condition") return i.condition || "Not set";
  if (g === "priority") return PRI[i.priority || 2] || "Medium";
  if (g === "name") { const c = (String(i.name || "").trim()[0] || "").toUpperCase(); return /[A-Z]/.test(c) ? c : "#"; }
  return "";
}
function groupedHtml(list, g) {
  const buckets = new Map();
  for (const i of list) { const k = groupLabel(i, g); if (!buckets.has(k)) buckets.set(k, []); buckets.get(k).push(i); }
  let keys = [...buckets.keys()];
  if (g === "priority") { const rank = { High: 0, Medium: 1, Low: 2 }; keys.sort((a, b) => (rank[a] ?? 9) - (rank[b] ?? 9)); }
  else keys.sort((a, b) => (UNGROUPED.test(a) || a === "#") === (UNGROUPED.test(b) || b === "#")
    ? a.localeCompare(b) : (UNGROUPED.test(a) || a === "#") ? 1 : -1);
  return keys.map(k => `<h2 class="group-head">${esc(k)}<span class="group-count">${buckets.get(k).length}</span></h2>${buckets.get(k).map(card).join("")}`).join("");
}

/* ---------- Photos ---------- */
function compressSrc(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => rej(new Error("That file isn’t an image the app can read."));
    img.src = src;
  });
}
function compress(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => compressSrc(r.result).then(res, rej);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}

/* ---------- Add using URL ---------- */
const UA = "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
/* Calls the CapacitorHttp plugin's methods directly (bypassing CORS for scraping shop pages/images and
   calling Gemini) rather than enabling CapacitorHttp's global fetch/XMLHttpRequest patch in
   capacitor.config.json -- that patch also intercepts Firebase's own SDK calls and breaks Storage
   uploads ("storage/unknown"), since Firebase's upload protocol doesn't survive being proxied through it. */
const nativeHttp = () => {
  const C = window.Capacitor;
  return C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.CapacitorHttp ? C.Plugins.CapacitorHttp : null;
};
const normUrl = s => {
  s = String(s || "").trim(); if (!s) return "";
  if (!/^https?:\/\//i.test(s)) s = "https://" + s;
  try { const u = new URL(s); return /^https?:$/.test(u.protocol) ? u.href : ""; } catch (e) { return ""; }
};
const parsePrice = s => {
  if (s == null) return null;
  let t = String(s).replace(/[^\d.,]/g, ""); if (!t) return null;
  if (t.includes(",") && t.includes(".")) t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  else if (t.includes(",")) t = /,\d{1,2}$/.test(t) ? t.replace(",", ".") : t.replace(/,/g, "");
  const n = parseFloat(t); return isFinite(n) ? n : null;
};
const SYMBOLS = { ZAR: "R", USD: "$", EUR: "€", GBP: "£", JPY: "¥", AUD: "A$", CAD: "C$", NZD: "NZ$", INR: "₹", CNY: "¥" };
const listJoin = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];

async function fetchPage(url) {

      headers: { "User-Agent": UA, "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8", "Accept-Language": "en-ZA,en;q=0.9" } });

async function fetchImage(src) {

/* ---------- Add using photos (Gemini vision) ---------- */
const CAM_MAX = 3;
const GEMINI_PROMPT = "You are helping catalog a physical collectible (e.g. a diecast car, action figure, trading "
  + "card, comic, toy, model kit) from photos someone just took of their own item. There may be up to three photos: "
  + "typically the item itself, then the back of it, then a price tag or receipt — but treat them as photos of the "
  + "same single item regardless of what each one shows. Identify the item as specifically as you can, and read any "
  + "price tag or sticker if one is visible. Reply with ONLY a compact JSON object (no markdown, no commentary) with "
  + "exactly these keys: name (the specific product/item name, without the brand), brand (manufacturer or brand "
  + "name, empty string if unclear), category (a short general category like \"Diecast Cars\", \"Trading Cards\" or "
  + "\"Action Figures\", empty string if unclear), description (one short sentence describing it), price (the "
  + "numeric price read from a tag/sticker/receipt if one of the photos shows one, otherwise null — a number only, "
  + "no currency symbol), search (a short, specific phrase someone could use to search for a clean product photo of "
  + "this exact item online, combining brand and name). If you cannot identify the item at all, return the text "
  + "fields as empty strings and price as null.";

async function recognizePhotos(base64s) {
  const key = (settings.geminiKey || "").trim();
  if (!key) throw Object.assign(new Error("No Gemini API key set"), { code: "no-key" });
  /* Google retires Gemini model names on a rolling schedule (gemini-2.0-flash shut down, gemini-2.5-flash is next,
     per ai.google.dev/gemini-api/docs/models) — if this starts 404ing again, that page names the current stable
     multimodal "flash" model to swap in here. */
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(key)}`;
  const body = JSON.stringify({
    contents: [{ parts: [{ text: GEMINI_PROMPT }, ...base64s.map(data => ({ inline_data: { mime_type: "image/jpeg", data } }))] }],
    generationConfig: { responseMimeType: "application/json" }
  });
  const H = nativeHttp();
  let data;
  if (H) {
    const r = await H.post({ url, headers: { "Content-Type": "application/json" }, data: body, connectTimeout: 20000, readTimeout: 30000 });
    if (r.status >= 400) throw Object.assign(new Error("status"), { status: r.status });
    data = typeof r.data === "string" ? JSON.parse(r.data) : r.data;
  } else {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body });
    if (!r.ok) throw Object.assign(new Error("status"), { status: r.status });
    data = await r.json();
  }
  const parts = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  const raw = parts.map(p => p.text || "").join("").trim().replace(/^```(?:json)?\s*|\s*```$/g, "");
  if (!raw) throw new Error("empty");
  const parsed = JSON.parse(raw);
  const str = v => String(v ?? "").trim();
  return {
    name: str(parsed.name), brand: str(parsed.brand), category: str(parsed.category),
    description: str(parsed.description).slice(0, 1500), search: str(parsed.search),
    price: parsePrice(parsed.price)
  };
}

/* One photo per tap (cover photo first, then back/price-tag shots appended), up to CAM_MAX;
   recognition runs on demand across every photo taken in this batch. */
function wireCamera(it, paintPhotos, dup) {
  const camBatch = [];
  const btn = $("#camBtn"), doneBtn = $("#camDoneBtn"), hint = $("#camHint");
  const show = msg => { hint.hidden = false; hint.textContent = msg; };

  btn.addEventListener("click", async () => {
    const P = window.Capacitor && window.Capacitor.Plugins;
    if (!P || !P.Camera) { show("Taking a picture only works in the Android app, not this preview."); return; }
    btn.disabled = true;
    try {
      const shot = await P.Camera.getPhoto({ quality: 80, resultType: "base64", source: "CAMERA", saveToGallery: false });
      if (!shot || !shot.base64String) return;
      let compressed;
      try { compressed = await compressSrc(`data:image/${shot.format || "jpeg"};base64,${shot.base64String}`); }
      catch (e) { show(e.message || "That photo couldn’t be used."); return; }
      if (camBatch.length === 0) photos.unshift(compressed); else if (photos.length < MAXP) photos.push(compressed);
      camBatch.push(compressed);
      paintPhotos();
      doneBtn.hidden = false; doneBtn.disabled = false; doneBtn.textContent = "Recognise photos";
      if (camBatch.length >= CAM_MAX) { btn.hidden = true; show(`Photo ${camBatch.length} of ${CAM_MAX} added. Tap Recognise to fill in the details.`); }
      else { btn.textContent = "Add Another Photo"; show(`Photo ${camBatch.length} of ${CAM_MAX} added — add the back or a price tag, or tap Recognise to fill in details now.`); }
    } catch (e) { if (!/cancel/i.test(String(e && e.message))) show("Couldn’t open the camera."); }
    finally { btn.disabled = false; }
  });

  doneBtn.addEventListener("click", async () => {
    if (!camBatch.length) return;
    if (!(settings.geminiKey || "").trim()) { show("Add a free Gemini API key in Settings to auto-fill the details from your photos."); return; }
    btn.disabled = true; doneBtn.disabled = true; doneBtn.textContent = "Recognising…"; show("Looking at the photos…");
    try {
      const d = await recognizePhotos(camBatch.map(p => p.split(",")[1]));
      const set = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
      set("f-name", d.name); set("f-brand", d.brand); set("f-cat", d.category); set("f-desc", d.description);
      if (d.price != null) { if (it.list === "owned") { set("f-paid", d.price); set("f-value", d.price); } else set("f-target", d.price); }
      dup();
      const filled = [d.name && "name", d.brand && "brand", d.category && "category", d.description && "description", d.price != null && "price"].filter(Boolean);
      if (!filled.length) { show("Couldn’t make out what this is from the photos. Fill in the details yourself."); doneBtn.disabled = false; doneBtn.textContent = "Recognise photos"; return; }
      btn.hidden = true; doneBtn.hidden = true;
      hint.hidden = false;
      hint.innerHTML = `Filled in ${esc(listJoin(filled))} from your photos. Check the details, then save.`
        + (d.search ? ` <a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(d.search)}" target="_blank" rel="noopener">Search for a clean photo online</a> if you’d rather use one — paste its page link above and tap Fetch.` : "");
    } catch (e) {
      show(e && e.code === "no-key" ? "Add a free Gemini API key in Settings to auto-fill the details from your photos."
        : e && e.status === 404 ? "The recognition model isn’t available any more (Google retired it) — this needs a code update."
        : e && e.status === 400 ? "The recognition service rejected the API key. Check it in Settings."
        : e && e.status ? `The recognition service refused the request (error ${e.status}).`
        : "Couldn’t reach the recognition service. Check your connection.");
      doneBtn.disabled = false; doneBtn.textContent = "Recognise photos";
    } finally { btn.disabled = false; }
  });
}

/* Reads product data from structured data (JSON-LD), Open Graph and microdata tags. */
function extractProduct(html, pageUrl) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const abs = u => { try { return new URL(String(u).trim(), pageUrl).href; } catch (e) { return ""; } };
  const sel = k => `meta[property="${k}"],meta[name="${k}"],meta[itemprop="${k}"]`;
  const meta = (...keys) => { for (const k of keys) { const el = doc.querySelector(sel(k)); const c = el && el.getAttribute("content"); if (c && c.trim()) return c.trim(); } return ""; };
  const metaAll = k => [...doc.querySelectorAll(sel(k))].map(m => m.getAttribute("content")).filter(Boolean);
  const itemprop = k => { const el = doc.querySelector(`[itemprop="${k}"]`); return el ? (el.getAttribute("content") || el.textContent || "").trim() : ""; };
  const text = s => { if (s == null || s === "") return ""; const d = new DOMParser().parseFromString(String(s), "text/html"); return (d.body.textContent || "").replace(/\s+/g, " ").trim(); };
  const firstLine = s => {
    if (s == null || s === "") return "";
    const d = new DOMParser().parseFromString(String(s), "text/html");
    const lines = (d.body.textContent || "").split(/\r?\n+/).map(x => x.replace(/\s+/g, " ").trim()).filter(Boolean);
    return lines[0] || "";
  };
  const nameOf = v => !v ? "" : typeof v === "string" ? v : Array.isArray(v) ? nameOf(v[0]) : String(v.name || "");
  const types = n => [].concat((n && n["@type"]) || []).map(String);

  const nodes = [];
  const walk = n => {
    if (!n || typeof n !== "object") return;
    if (Array.isArray(n)) { n.forEach(walk); return; }
    nodes.push(n);
    if (n["@graph"]) walk(n["@graph"]);
    if (n.mainEntity) walk(n.mainEntity);
  };
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(s => {
    const raw = s.textContent.trim();
    try { walk(JSON.parse(raw)); }
    catch (e) {
      /* Some storefronts inject stray markup into this block, which breaks JSON.parse; strip tags and retry. */
      try { walk(JSON.parse(raw.replace(/<[^>]*>/g, ""))); } catch (e2) {}
    }
  });
  const product = nodes.find(n => types(n).some(t => /^(Product|ProductGroup|IndividualProduct|ProductModel|Book)$/i.test(t))) || {};
  const crumbs = nodes.find(n => types(n).includes("BreadcrumbList"));

  let name = text(product.name);
  if (!name) {
    name = text(meta("og:title", "twitter:title") || doc.title);
    const parts = name.split(/\s+[|–—-]\s+/);
    if (parts.length > 1 && parts[0].length > 3) name = parts[0];
  }
  const description = (firstLine(product.description) || text(meta("og:description", "description", "twitter:description"))).slice(0, 1500);
  const brand = text(nameOf(product.brand) || nameOf(product.manufacturer) || meta("product:brand", "og:brand", "brand") || itemprop("brand"));

  let category = text(nameOf(product.category) || meta("product:category", "og:category", "category"));
  if (/[>/]/.test(category)) category = category.split(/\s*[>/]\s*/).filter(Boolean).pop() || "";
  if (!category) {
    let items = [];
    if (crumbs) {
      items = [].concat(crumbs.itemListElement || [])
        .sort((a, b) => (+a.position || 0) - (+b.position || 0))
        .map(i => text((i.item && typeof i.item === "object" ? i.item.name : "") || i.name || ""));
    }
    if (!items.length) {
      const nav = doc.querySelector('nav[aria-label="breadcrumb" i], nav[aria-label="breadcrumbs" i], ol.breadcrumb, ul.breadcrumb, .breadcrumbs, [itemtype*="BreadcrumbList" i]');
      if (nav) items = [...nav.querySelectorAll("li")].map(li => text(li.textContent));
    }
    items = items.filter(n => n && !/^home$/i.test(n));
    if (items.length) {
      const last = items[items.length - 1];
      category = norm(last) === norm(name) && items.length > 1 ? items[items.length - 2] : last;
    }
  }

  /* Strip a leading "Brand - " from the title only once the breadcrumb/category match above has run,
     since storefronts often repeat the untouched title as the final breadcrumb crumb. */
  if (brand) {
    const safeBrand = brand.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    name = name.replace(new RegExp(`^\\s*${safeBrand}\\s*[:\\-–—|]\\s*`, "i"), "").trim() || name;
  }

  let price = null, currency = "";
  const offers = [].concat(product.offers || []);
  for (const o of offers) {
    if (!o || typeof o !== "object") continue;
    const spec = [].concat(o.priceSpecification || [])[0] || {};
    const p = parsePrice(o.price ?? o.lowPrice ?? spec.price);
    if (p != null) { price = p; currency = o.priceCurrency || spec.priceCurrency || ""; break; }
    if (o.offers) offers.push(...[].concat(o.offers));
  }
  if (price == null) {
    const p = parsePrice(meta("product:price:amount", "og:price:amount", "price") || itemprop("price"));
    if (p != null) { price = p; currency = meta("product:price:currency", "og:price:currency", "priceCurrency") || itemprop("priceCurrency"); }
  }

  const images = [];
  const addImg = v => {
    if (!v) return;
    if (Array.isArray(v)) { v.forEach(addImg); return; }
    if (typeof v === "object") { addImg(v.contentUrl || v.url || v.thumbnailUrl); return; }
    const u = abs(v);
    if (/^https?:/i.test(u) && !images.includes(u)) images.push(u);
  };
  addImg(product.image);
  ["og:image", "og:image:secure_url", "og:image:url", "twitter:image"].forEach(k => metaAll(k).forEach(addImg));
  doc.querySelectorAll('[itemprop="image"]').forEach(el => addImg(el.getAttribute("content") || el.getAttribute("src") || el.getAttribute("href")));
  const lis = doc.querySelector('link[rel="image_src"]'); if (lis) addImg(lis.getAttribute("href"));

  /* Listings are assumed new/sealed unless the page itself says otherwise. */
  const usedHints = /\b(pre[- ]?owned|second[- ]?hand|used|refurbished|open box|no box|loose|as[- ]?is|previously owned|display(?:ed)? only)\b/i;
  const condition = usedHints.test(`${product.name || ""} ${product.description || ""} ${name} ${description}`) ? "" : "Sealed / new in box";

  return { name, description, brand, category, condition, price, currency: String(currency || "").toUpperCase(), images: images.slice(0, MAXP) };
}

async function fillFromUrl(it, paintPhotos, dup) {
  const input = $("#f-url"), btn = $("#urlBtn"), hint = $("#urlHint");
  const url = normUrl(input.value);
  if (!url) { hint.textContent = "That doesn’t look like a web link. It should start with https://"; input.focus(); return; }
  input.value = url;
  btn.disabled = true; btn.textContent = "Fetching…"; hint.textContent = "Reading the page…";
  try {
    let page;
    try { page = await fetchPage(url); }
    catch (e) {
      hint.textContent = !nativeHttp()
        ? "This preview can’t reach other websites. Add using URL works in the Android app."
        : e.status ? `The site refused the request (error ${e.status}). Some shops block apps, so fill in the details yourself.`
        : "Couldn’t reach that page. Check the link and your connection.";
      return;
    }
    const d = extractProduct(page.html, page.finalUrl);
    const set = (id, v) => { const el = document.getElementById(id); if (el && v != null && v !== "") el.value = v; };
    set("f-name", d.name); set("f-brand", d.brand); set("f-cat", d.category); set("f-desc", d.description); set("f-cond", d.condition);
    if (d.price != null) {
      if (it.list === "owned") { set("f-paid", d.price); set("f-value", d.price); } else set("f-target", d.price);
    }
    let notedUrl = false;
    const notesEl = $("#f-notes");
    if (notesEl && !notesEl.value.trim()) {
      notesEl.value = (it.list === "owned" ? "Bought from: " : "Found at: ") + url;
      notedUrl = true;
    }
    let got = 0;
    if (d.images.length) hint.textContent = "Getting photos…";
    for (const src of d.images) {
      if (photos.length >= MAXP) break;
      try { const p = await fetchImage(src); if (!photos.includes(p)) { photos.push(p); got++; } } catch (e) {}
    }
    paintPhotos(); dup();
    const filled = [d.name && "name", d.brand && "brand", d.category && "category", d.description && "description",
      d.condition && "condition", d.price != null && "price", notedUrl && "notes", got && `${got} ${got === 1 ? "photo" : "photos"}`].filter(Boolean);
    let msg = filled.length ? `Filled in ${listJoin(filled)}. Check the details, then save.` : "Couldn’t find product details on that page. Fill them in yourself.";
    if (d.price != null && d.currency && SYMBOLS[d.currency] !== settings.currency.trim()) msg += ` The price is in ${d.currency}.`;
    hint.textContent = msg;
  } finally {
    btn.disabled = false; btn.textContent = "Fetch";
  }
}

let editing = null, photos = [];
const MAXP = 8;

function openForm(item, convert) {
  const isNew = !item;

      <div class="cam-row">
        <button type="button" class="btn ghost" id="camBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
          Take a Picture
        </button>
        <button type="button" class="btn ghost" id="camDoneBtn" hidden>Recognise photos</button>
      </div>
      <p class="hint" id="camHint" hidden></p>
    </div>
    <div class="photo-main" id="photoMain"></div>
    <div class="thumbs" id="thumbs"></div>
    <input type="file" accept="image/*" id="photoIn" multiple hidden>
    <div class="field">
      <label for="f-name">Name</label>
      <input id="f-name" value="${val(it.name)}" autocomplete="off" placeholder="e.g. Charizard Base Set 4/102">
      <p class="hint warn" id="dupHint" hidden></p>
    </div>
    <div class="row">
      <div class="field"><label for="f-cat">Category</label>
        <input id="f-cat" value="${val(it.category)}" placeholder="e.g. Trading cards" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
        <ul class="ac-list" id="catSuggest" hidden></ul></div>
      <div class="field"><label for="f-series">Series or set</label>
        <input id="f-series" value="${val(it.series)}" placeholder="e.g. Base Set" autocomplete="off"></div>
    </div>
    <div class="field"><label for="f-brand">Brand</label>
      <input id="f-brand" value="${val(it.brand)}" placeholder="e.g. Funko, LEGO, Hot Wheels" autocomplete="off"></div>
    ${owned ? `
    <div class="row">
      <div class="field"><label for="f-cond">Condition</label>
        <select id="f-cond">${CONDITIONS.map(c => `<option value="${esc(c)}"${c === (it.condition || "") ? " selected" : ""}>${c || "Not set"}</option>`).join("")}</select></div>
      <div class="field"><label for="f-qty">Quantity</label>
        <input id="f-qty" type="number" inputmode="numeric" min="1" step="1" value="${val(it.qty || 1)}"></div>
    </div>
    <div class="row">
      <div class="field"><label for="f-paid">Price paid (${cur})</label>
        <input id="f-paid" type="number" inputmode="decimal" min="0" step="any" value="${val(it.paid)}"></div>
      <div class="field"><label for="f-value">Value each (${cur})</label>
        <input id="f-value" type="number" inputmode="decimal" min="0" step="any" value="${val(it.value)}"></div>

    <div class="row">
      <div class="field"><label for="f-target">Target price (${cur})</label>
        <input id="f-target" type="number" inputmode="decimal" min="0" step="any" value="${val(it.target)}"></div>

      ${!owned ? `<button class="btn ghost" id="moveBtn">Move to collection</button>` : ""}

  });
  $("#thumbs").addEventListener("click", e => {
    const r = e.target.closest("[data-rm]"), m = e.target.closest("[data-main]");
    if (r) { photos.splice(+r.dataset.rm, 1); paintPhotos(); }

  });

  $("#f-url").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#urlBtn").click(); } });

  const dup = () => {
    const n = norm($("#f-name").value), h = $("#dupHint");

    h.hidden = false;
    h.textContent = other.list === "owned"
      ? `You already own this${+other.qty > 1 ? ` (×${other.qty})` : ""}.`
      : "This is on your wishlist. Saving here won’t remove it from there.";
  };
  $("#f-name").addEventListener("input", dup); dup();
  wireCamera(it, paintPhotos, dup);

  /* Custom category suggestions (not a native <datalist>: Android WebView mispositions its
     popup when the input sits inside this scrolling, animated bottom sheet). */
  (() => {
    const catInput = $("#f-cat"), list = $("#catSuggest");
    let active = -1;
    const close = () => { list.hidden = true; list.innerHTML = ""; active = -1; catInput.setAttribute("aria-expanded", "false"); };
    const open = () => {
      const q = norm(catInput.value);
      const matches = cats.filter(c => norm(c).includes(q) && norm(c) !== q).slice(0, 8);
      if (!matches.length) { close(); return; }
      list.innerHTML = matches.map(c => `<li>${esc(c)}</li>`).join("");
      list.hidden = false; active = -1; catInput.setAttribute("aria-expanded", "true");
    };
    catInput.addEventListener("input", open);
    catInput.addEventListener("focus", open);
    catInput.addEventListener("blur", () => setTimeout(close, 150));
    list.addEventListener("mousedown", e => {
      const li = e.target.closest("li"); if (!li) return;
      e.preventDefault();
      catInput.value = li.textContent; close();
    });
    catInput.addEventListener("keydown", e => {
      if (list.hidden) return;
      const items = [...list.children];
      if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(items.length - 1, active + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, active - 1); }
      else if (e.key === "Enter" && active >= 0) { e.preventDefault(); catInput.value = items[active].textContent; close(); return; }
      else if (e.key === "Escape") { close(); return; }
      else return;
      items.forEach((li, i) => li.classList.toggle("active", i === active));
    });
  })();

  $("#saveBtn").addEventListener("click", save);
  $("#cancelBtn").addEventListener("click", closeSheet);
  const mv = $("#moveBtn"); if (mv) mv.addEventListener("click", () => openForm(state.items.find(i => i.id === it.id), true));
  const del = $("#delBtn");
  if (del) del.addEventListener("click", () => armThen(del, "Tap again to delete", async () => {
    await store.del(it.id);
    state.items = state.items.filter(i => i.id !== it.id);
    closeSheet(); render(); toast("Deleted");
    cloudDeleteItem(it.id);
  }));
  showSheet();
}

async function save() {
  const { it, isNew, convert } = editing;
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  const num = x => x === "" ? null : Math.max(0, Number(x));
  const name = v("f-name");
  if (!name) { $("#f-name").focus(); toast("Give it a name first"); return; }
  Object.assign(it, { name, category: v("f-cat"), series: v("f-series"), brand: v("f-brand"), description: v("f-desc"),
    url: normUrl(v("f-url")), notes: v("f-notes"), photos: photos.slice(), photo: photos[0] || null, updated: Date.now(),
    scope: it.scope || currentScope });
  if (it.list === "owned") {
    Object.assign(it, { condition: v("f-cond"), qty: Math.max(1, parseInt(v("f-qty"), 10) || 1), paid: num(v("f-paid")), value: num(v("f-value")) });
  } else {
    Object.assign(it, { target: num(v("f-target")), priority: +v("f-pri") || 2 });
  }
  try { await store.put(it); }
  catch (e) { toast("Couldn’t save. The phone may be low on storage."); return; }
  const idx = state.items.findIndex(i => i.id === it.id);
  if (idx >= 0) state.items[idx] = it; else state.items.push(it);
  if (convert || isNew) state.tab = it.list;
  closeSheet(); render();
  toast(convert ? "Added to your collection" : isNew ? "Saved" : "Changes saved");
  cloudPushItem(it).catch(() => toast("Saved here, but couldn’t sync to the cloud."));
}

function armThen(btn, armedLabel, action) {
  if (btn.classList.contains("armed")) { action(); return; }
  const original = btn.textContent;
  btn.classList.add("armed"); btn.textContent = armedLabel;
  setTimeout(() => { btn.classList.remove("armed"); btn.textContent = original; }, 3500);
}

async function uploadPhoto(itemId, index, dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  const ref = fbStorage.ref(`users/${cloudUser.uid}/items/${itemId}/${index}.jpg`);
  await ref.put(blob, { contentType: "image/jpeg" });
  return ref.getDownloadURL();
}

/* Uploads any photos not already cached from a previous push (cloudPhotos), then writes the item --
   Firestore keeps the photos as Storage URLs, never the raw base64, to stay well under its 1MB/doc limit. */
async function cloudPushItem(it) {
  if (!cloudEnabled || !cloudUser) return;
  const photos = it.photos || [], cached = it.cloudPhotos || [];
  const urls = [];
  for (let i = 0; i < photos.length; i++) urls.push(cached[i] || await uploadPhoto(it.id, i, photos[i]));
  it.cloudPhotos = urls;
  try { await store.put(it); } catch (e) {}
  const { photos: _p, photo: _ph, cloudPhotos: _cp, ...rest } = it;
  const doc = JSON.parse(JSON.stringify({ ...rest, photos: urls, photo: urls[0] || null }));
  await fbDb.collection("users").doc(cloudUser.uid).collection("items").doc(it.id).set(doc);
  settings.lastSynced = Date.now(); saveSettings();
  const authHint = $("#authHint"); if (authHint) authHint.textContent = "Synced just now.";
}

async function cloudDeleteItem(id) {
  if (!cloudEnabled || !cloudUser) return;
  try { await fbDb.collection("users").doc(cloudUser.uid).collection("items").doc(id).delete(); } catch (e) {}
}

async function cloudPushSettings() {
  if (!cloudEnabled || !cloudUser) return;
  const { lastSynced, ...rest } = settings; // sync timestamp itself stays device-local, never synced
  try { await fbDb.collection("users").doc(cloudUser.uid).collection("meta").doc("settings").set(rest); } catch (e) {}
}

/* Pulls every remote item newer than the local copy, downloads its photos (in parallel, across all
   items at once, rather than one photo at a time -- much faster for a full pull after a fresh
   install), and pushes up any local item the cloud doesn't have yet (covers signing in for the first
   time with existing local items). Each item is isolated in its own try/catch: one item failing to
   store (e.g. hitting a storage quota) used to throw out of the whole loop and silently abandon every
   item after it -- now it's just counted as failed and the rest still go through. */
let cloudSyncing = false;
async function cloudPullAll(silent) {
  if (!cloudEnabled || !cloudUser) return;
  const setHint = msg => { const h = $("#authHint"); if (h) h.textContent = msg; };
  if (cloudSyncing) { toast("Already syncing…"); setHint("Already syncing…"); return; }
  cloudSyncing = true;
  $("#settingsBtn").classList.add("syncing");
  if (!silent) toast("Syncing…");
  setHint("Syncing…");
  try {
    const snap = await fbDb.collection("users").doc(cloudUser.uid).collection("items").get();
    const toPull = snap.docs.filter(doc => {
      const remote = doc.data();
      const existing = state.items.find(i => i.id === doc.id);
      if (!existing) return true;
      if ((existing.updated || 0) < (remote.updated || 0)) return true;
      // metadata is up to date, but keep retrying if a past pull came back with fewer photos than
      // the cloud actually has for it (e.g. a flaky download last time) -- otherwise that gap is
      // permanent, since nothing else here would ever trigger a re-pull of this item again.
      const remoteUrlCount = Array.isArray(remote.photos) ? remote.photos.length : 0;
      const localPhotoCount = Array.isArray(existing.photos) ? existing.photos.length : 0;
      return localPhotoCount < remoteUrlCount;
    });
    let pulled = 0, failed = 0;
    await Promise.all(toPull.map(async doc => {
      try {
        const remote = doc.data();
        const urls = Array.isArray(remote.photos) ? remote.photos : [];
        const fetched = (await Promise.all(urls.map(url => fetchImage(url).catch(() => null)))).filter(Boolean);
        const existing = state.items.find(i => i.id === doc.id);
        // Never overwrite a local copy with fewer photos than it already has -- a failed or partial
        // re-download should lose nothing; keep the existing photos instead of the worse new result.
        const keepExisting = !!existing && (existing.photos || []).length >= fetched.length;
        const photos = keepExisting ? existing.photos : fetched;
        const photo = keepExisting ? existing.photo : (fetched[0] || null);
        const cloudPhotos = keepExisting ? (existing.cloudPhotos || urls) : urls;
        await store.put({ ...remote, id: doc.id, photos, photo, cloudPhotos, scope: currentScope });
        if (urls.length > fetched.length) failed++; else pulled++;
      } catch (e) { failed++; }
    }));
    const remoteIds = new Set(snap.docs.map(d => d.id));
    for (const it of state.items) {
      if (remoteIds.has(it.id)) continue;
      try { await cloudPushItem(it); } catch (e) {}
    }
    try {
      const metaDoc = await fbDb.collection("users").doc(cloudUser.uid).collection("meta").doc("settings").get();
      if (metaDoc.exists) { Object.assign(settings, metaDoc.data()); saveSettings(); } else { await cloudPushSettings(); }
    } catch (e) {}
    state.items = await store.all(currentScope);
    render();
    settings.lastSynced = Date.now(); saveSettings();
    const msg = failed ? `Synced, but ${failed} ${failed === 1 ? "item" : "items"} didn’t come through — tap Sync now to retry.`
      : pulled ? `Synced — updated ${pulled} ${pulled === 1 ? "item" : "items"}` : "Synced — everything’s up to date";
    if (!silent || failed) toast(msg);
    setHint(`${msg} (just now)`);
  } catch (e) {
    const msg = "Couldn’t sync: " + authErrorMsg(e);
    if (!silent) toast(msg);
    setHint(msg);
  } finally {
    cloudSyncing = false;
    $("#settingsBtn").classList.remove("syncing");
  }
}

function refreshSettingsIfOpen() {
  if (sheetOpen && $("#sheetTitle") && $("#sheetTitle").textContent === "Settings") openSettings();
}

/* Items are partitioned by `scope` (see store.all above): switching accounts, or signing out back to
   "local", swaps which partition `state.items` shows, so one account's synced items never leak into
   another account's view or the signed-out local-only view. */
function maybeShowWelcome() {
  if (welcomeShown || !appReady || (cloudEnabled && !authResolvedOnce)) return;
  if (!settings.onboarded) { welcomeShown = true; showWelcome(); }
}
if (cloudEnabled) {
  fbAuth.onAuthStateChanged(async user => {
    cloudUser = user;
    currentScope = user ? user.uid : "local";
    if (appReady) { state.items = await store.all(currentScope); render(); }
    if (appReady && user) cloudPullAll(true);
    refreshSettingsIfOpen();
    if (!authResolvedOnce) { authResolvedOnce = true; if (user) { settings.onboarded = true; saveSettings(); } }
    maybeShowWelcome();
  });
}

/* ---------- Settings + backup ---------- */
function openSettings() {
  $("#sheetBody").innerHTML = `
    <h2 id="sheetTitle">Settings</h2>
    <h3>Account &amp; sync</h3>
    ${!cloudEnabled ? `<p class="hint">Cloud sync isn’t set up for this build yet.</p>` : cloudUser ? `
    <p class="hint">Signed in as ${esc(cloudUser.email)}. Your collection and settings sync to the cloud automatically when you save; photos go too.</p>
    <div class="actions">
      <button class="btn ghost" id="syncBtn">Sync now</button>
      <button class="btn ghost" id="signOutBtn">Sign out</button>
    </div>
    <p class="hint" id="authHint">${settings.lastSynced ? `Last synced ${esc(timeAgo(settings.lastSynced))}.` : ""}</p>` : `
    <p class="hint">Sign in to back up your collection to the cloud, sync it to another device, and manage currency, backup and photo-recognition settings.</p>
    <div class="field"><label for="s-email">Email</label>
      <input id="s-email" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label for="s-pass">Password</label>
      <input id="s-pass" type="password" autocomplete="current-password" placeholder="For new accounts: 8+ chars, a number, a symbol"></div>
    <div class="actions">
      <button class="btn primary" id="signInBtn">Sign in</button>
      <button class="btn ghost" id="signUpBtn">Create account</button>
    </div>
    <button type="button" class="link plain" id="forgotBtn">Forgot password?</button>
    <p class="hint" id="authHint"></p>`}
    ${cloudUser ? `
    <h3>Currency</h3>
    <div class="field"><label for="s-cur">Currency symbol</label>
      <input id="s-cur" value="${esc(settings.currency)}" maxlength="4" autocomplete="off"></div>
    <h3>Photo recognition</h3>
    <p class="hint">To auto-fill details from a photo (Take a Picture), paste in a free Gemini API key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Without one, photos are still added, just not recognised.</p>
    <div class="field"><label for="s-gemini">Gemini API key</label>
      <input id="s-gemini" type="password" value="${esc(settings.geminiKey)}" placeholder="Paste your API key" autocomplete="off"></div>
    <h3>Backup</h3>
    <p class="hint">Your collection already syncs to the cloud, but export a local copy now and then too.</p>
    <div class="actions">
      <button class="btn ghost" id="expBtn">Export backup</button>
      <label class="btn ghost" for="impIn">Import backup</label>
      <input type="file" id="impIn" accept="application/json,.json,text/plain,.txt" hidden>
    </div>
    <div id="backupOut"></div>
    <div class="more"><button class="btn danger" id="wipeBtn">Delete everything</button></div>` : ""}
    <div class="actions"><button class="btn primary" id="sDone">Done</button></div>`;
  if (cloudEnabled && cloudUser) {
    $("#syncBtn").addEventListener("click", () => cloudPullAll());
    $("#signOutBtn").addEventListener("click", () => cloudSignOut());
  } else if (cloudEnabled) {
    const authHint = $("#authHint");
    const authAction = async (fn, okMsg, requirePolicy) => {
      const email = $("#s-email").value.trim(), pass = $("#s-pass").value;
      if (!email || !pass) { authHint.textContent = "Enter an email and password."; return; }
      if (requirePolicy) { const err = passwordPolicyError(pass); if (err) { authHint.textContent = err; return; } }
      authHint.textContent = "Working…";
      try { await fn(email, pass); toast(okMsg); } catch (e) { authHint.textContent = authErrorMsg(e); }
    };
    $("#signInBtn").addEventListener("click", () => authAction(cloudSignIn, "Signed in", false));
    $("#signUpBtn").addEventListener("click", () => authAction(cloudSignUp, "Account created", true));
    $("#forgotBtn").addEventListener("click", async () => {
      const email = $("#s-email").value.trim();
      if (!email) { authHint.textContent = "Enter your email first."; return; }
      try { await cloudResetPassword(email); authHint.textContent = "Check your email for a reset link."; }
      catch (e) { authHint.textContent = authErrorMsg(e); }
    });
  }
  if (cloudUser) {
    $("#s-cur").addEventListener("input", e => { settings.currency = e.target.value; saveSettings(); render(); cloudPushSettings(); });
    $("#s-gemini").addEventListener("input", e => { settings.geminiKey = e.target.value.trim(); saveSettings(); });
    $("#expBtn").addEventListener("click", exportBackup);
    $("#impIn").addEventListener("change", importBackup);
    const wipe = $("#wipeBtn");
    wipe.addEventListener("click", () => armThen(wipe, "Tap again to delete all items", async () => {
      const ids = state.items.map(i => i.id);
      for (const id of ids) await store.del(id);
      state.items = []; closeSheet(); render(); toast("All items deleted");
      ids.forEach(cloudDeleteItem);
    }));
  }
  $("#sDone").addEventListener("click", closeSheet);
  showSheet();
}

async function exportBackup() {
  const data = JSON.stringify({ app: "cabinet", version: 1, exported: new Date().toISOString(), settings, items: state.items });
  const name = `micollects-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const P = window.Capacitor && window.Capacitor.Plugins;
  if (P && P.Filesystem && P.Share) {
    try {
      const r = await P.Filesystem.writeFile({ path: name, data, directory: "CACHE", encoding: "utf8" });
      await P.Share.share({ title: "miCollects backup", url: r.uri, dialogTitle: "Save your backup" });
      return;
    } catch (e) { if (/cancel/i.test(String(e && e.message))) return; }
  }
  try {
    const file = new File([data], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "miCollects backup" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(data); toast("Backup copied. Paste it into a note or email to keep it."); return; }
  catch (e) {}
  $("#backupOut").innerHTML = `<p class="hint">Copy this text and keep it somewhere safe:</p><textarea class="backup-text" readonly>${esc(data)}</textarea>`;
  const ta = $("#backupOut textarea"); ta.focus(); ta.select();
}

async function importBackup(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const parsed = JSON.parse(await f.text());
    const items = Array.isArray(parsed) ? parsed : parsed.items;
    if (!Array.isArray(items)) throw new Error("bad");
    let n = 0;
    for (const raw of items) {
      if (!raw || !raw.name || !["owned", "wish"].includes(raw.list)) continue;
      const it = { ...raw, id: raw.id || uid(), scope: currentScope };
      const existing = state.items.find(i => i.id === it.id);
      if (existing && (existing.updated || 0) > (it.updated || 0)) continue;
      await store.put(it); n++;
    }
    if (parsed.settings && typeof parsed.settings === "object") { Object.assign(settings, parsed.settings); saveSettings(); }
    state.items = await store.all(currentScope);
    closeSheet(); render();
    toast(n ? `Imported ${n} ${n === 1 ? "item" : "items"}` : "Nothing new in that backup");
    if (n && cloudUser) cloudPullAll(true);
  } catch (err) {
    toast("That file isn’t a miCollects backup.");
  }
  e.target.value = "";
}

/* ---------- Events ---------- */
$("#grid").addEventListener("click", e => {
  if (e.target.closest("[data-add]")) { openForm(null); return; }
  const got = e.target.closest("[data-got]");
  if (got) { e.stopPropagation(); openForm(state.items.find(i => i.id === got.dataset.got), true); return; }
  const c = e.target.closest(".card");
  if (c) openForm(state.items.find(i => i.id === c.dataset.id));
});
$("#grid").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")) { e.preventDefault(); e.target.click(); }
});
$("#chips").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) { state.cat = b.dataset.cat; render(); } });
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("#group").addEventListener("change", e => { state.group = e.target.value; render(); });
$("#layoutBar").addEventListener("click", e => {
  const b = e.target.closest("[data-layout]"); if (!b) return;
  state.layout = settings.layout = b.dataset.layout; saveSettings(); render(); cloudPushSettings();
});
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (state.tab === b.dataset.tab) return;
  state.tab = b.dataset.tab; state.cat = "All"; render(); scrollTo({ top: 0 });
}));
$("#addBtn").addEventListener("click", () => openForm(null));
$("#settingsBtn").addEventListener("click", openSettings);

/* ---------- Welcome (first launch) ---------- */
function showWelcome() {
  $("#welcome").hidden = false;
  $("#wSignIn").hidden = $("#wSignUp").hidden = !cloudEnabled;
  setTimeout(() => { $("#welcomeChoices").hidden = false; }, 1000);
}
function finishWelcome() { settings.onboarded = true; saveSettings(); $("#welcome").hidden = true; }
$("#wLocal").addEventListener("click", finishWelcome);
$("#wSignIn").addEventListener("click", () => openWelcomeForm("signin"));
$("#wSignUp").addEventListener("click", () => openWelcomeForm("signup"));
$("#wfBack").addEventListener("click", () => { $("#welcomeForm").hidden = true; $("#welcomeChoices").hidden = false; });
function openWelcomeForm(mode) {
  $("#welcomeChoices").hidden = true;
  $("#welcomeForm").hidden = false;
  $("#wfHint").textContent = "";
  $("#wfTitle").textContent = mode === "signin" ? "Sign in" : "Create account";
  $("#wfSubmit").textContent = mode === "signin" ? "Sign in" : "Create account";
  $("#wfSubmit").onclick = async () => {
    const email = $("#wf-email").value.trim(), pass = $("#wf-pass").value;
    const hint = $("#wfHint");
    if (!email || !pass) { hint.textContent = "Enter an email and password."; return; }
    if (mode === "signup") { const err = passwordPolicyError(pass); if (err) { hint.textContent = err; return; } }
    hint.textContent = "Working…";
    try { await (mode === "signin" ? cloudSignIn(email, pass) : cloudSignUp(email, pass)); finishWelcome(); }
    catch (e) { hint.textContent = authErrorMsg(e); }
  };
}

/* ---------- Start ---------- */
(async () => {
  await store.open();
  try { state.items = await store.all(currentScope); } catch (e) { state.items = []; }
  render();
  if (!store.db) toast("Storage is unavailable, so items won’t be kept after closing.");
  appReady = true;
  if (cloudUser) cloudPullAll(true);
  maybeShowWelcome();
})();
</script>
</body>
