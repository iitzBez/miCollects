async function save() {
  const { it, isNew, convert } = editing;
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  const num = x => x === "" ? null : Math.max(0, Number(x));
  const name = v("f-name");
  if (!name) { $("#f-name").focus(); toast("Give it a name first"); return; }
  Object.assign(it, { name, category: v("f-cat"), series: v("f-series"), brand: v("f-brand"), scale: v("f-scale"), color: v("f-color"), description: v("f-desc"),
    url: normUrl(v("f-url")), productUrl: normUrl(v("f-producturl")), notes: v("f-notes"), photos: photos.slice(), photo: photos[0] || null, updated: Date.now(),
    rating: +$("#f-rating").dataset.value || 0, condition: v("f-cond"), rarity: v("f-rarity"), scope: it.scope || currentScope });
  if (it.list === "owned") {
    Object.assign(it, { qty: Math.max(1, parseInt(v("f-qty"), 10) || 1), paid: num(v("f-paid")), value: num(v("f-value")), purchaseDate: v("f-purchdate") || null, buildHours: num(v("f-buildh")), buildMinutes: num(v("f-buildm")) });
  } else {
    Object.assign(it, { target: num(v("f-target")), priority: +v("f-pri") || 2 });
  }
  try { await store.put(it); }
  catch (e) { toast("Couldn’t save. The phone may be low on storage."); return; }
  const idx = state.items.findIndex(i => i.id === it.id);
  if (idx >= 0) state.items[idx] = it; else state.items.push(it);
  if (convert || isNew) state.tab = it.list;
  closeSheet(); render();
  toast(convert ? (it.list === "owned" ? "Added to your collection" : "Moved to your wishlist") : isNew ? "Saved" : "Changes saved");
  cloudPushItem(it).then(() => { refreshShareIfActive(); refreshItemShareIfActive(it); }).catch(() => toast("Saved here, but couldn’t sync to the cloud."));
}

/* Bulk update (from multi-select): each field here is opt-in -- only a field the user actually
   sets gets written to every selected item, so leaving the rest blank/"No change" never unsets
   whatever those items already had. */
function openBulkUpdate() {
  const ids = [...state.selected];
  const n = ids.length;
  if (!n) return;
  const cats = [...new Set(state.items.map(i => i.category).filter(Boolean))].sort();
  const seriesList = [...new Set(state.items.map(i => i.series).filter(Boolean))].sort();
  const brands = [...new Set(state.items.map(i => i.brand).filter(Boolean))].sort();
  const scales = [...new Set(state.items.map(i => i.scale).filter(Boolean))].sort();
  $("#sheetBody").innerHTML = `
    <h2 id="sheetTitle">Update ${n} ${n === 1 ? "item" : "items"}</h2>
    <p class="hint bu-intro">Leave a field blank (or on "No change") to keep each item's own value -- only fields you set here get applied to every selected item.</p>
    <div class="row">
      <div class="field"><label for="bu-cat">Category</label>
        <input id="bu-cat" placeholder="No change" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
        <ul class="ac-list" id="buCatSuggest" hidden></ul></div>
      <div class="field"><label for="bu-series">Series or set</label>
        <input id="bu-series" placeholder="No change" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
        <ul class="ac-list" id="buSeriesSuggest" hidden></ul></div>
    </div>
    <div class="row">
      <div class="field"><label for="bu-brand">Brand</label>
        <input id="bu-brand" placeholder="No change" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
        <ul class="ac-list" id="buBrandSuggest" hidden></ul></div>
      <div class="field"><label for="bu-scale">Size</label>
        <input id="bu-scale" placeholder="No change" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
        <ul class="ac-list" id="buScaleSuggest" hidden></ul></div>
    </div>
    <div class="field"><label for="bu-pri">Priority</label>
      <button type="button" class="select-btn" id="bu-pri" value=""><span>No change</span>${CHEVRON_SVG}</button></div>
    <div class="actions">
      <button class="btn primary" id="bulkSaveBtn">Update ${n} ${n === 1 ? "item" : "items"}</button>
      <button class="btn ghost" id="bulkCancelBtn">Cancel</button>
    </div>`;
  wireSuggest("bu-cat", "buCatSuggest", cats);
  wireSuggest("bu-series", "buSeriesSuggest", seriesList);
  wireSuggest("bu-brand", "buBrandSuggest", brands);
  wireSuggest("bu-scale", "buScaleSuggest", scales);
  const priBtn = $("#bu-pri");
  priBtn.addEventListener("click", () => openPicker("Priority",
    [["", "No change", ICONS.notSet], ...[3, 2, 1].map(p => [p, PRI[p], ICONS.priority])],
    priBtn.value, v => { priBtn.value = v; priBtn.querySelector("span").textContent = v ? PRI[v] : "No change"; }));
  $("#bulkCancelBtn").addEventListener("click", closeSheet);
  $("#bulkSaveBtn").addEventListener("click", async () => {
    const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
    const patch = {};
    const cat = v("bu-cat"); if (cat) patch.category = cat;
    const series = v("bu-series"); if (series) patch.series = series;
    const brand = v("bu-brand"); if (brand) patch.brand = brand;
    const scale = v("bu-scale"); if (scale) patch.scale = scale;
    const pri = priBtn.value; if (pri) patch.priority = +pri;
    if (!Object.keys(patch).length) { toast("Set at least one field to update"); return; }
    $("#bulkSaveBtn").disabled = true;
    const touched = [];
    for (const id of ids) {
      const it = state.items.find(i => i.id === id); if (!it) continue;
      Object.assign(it, patch, { updated: Date.now() });
      try { await store.put(it); touched.push(it); } catch (e) {}
    }
    closeSheet(); exitSelectModeAndPop();
    toast(`Updated ${touched.length} ${touched.length === 1 ? "item" : "items"}`);
    touched.forEach(it => cloudPushItem(it).catch(() => {}));
    refreshShareIfActive();
  });
  addClearButtons($("#sheetBody"));
  showSheet();
}

function armThen(btn, armedLabel, action) {
  if (btn.classList.contains("armed")) { action(); return; }
  const original = btn.textContent;
  btn.classList.add("armed"); btn.textContent = armedLabel;
  setTimeout(() => { btn.classList.remove("armed"); btn.textContent = original; }, 3500);
}

const RETIRED_STORAGE_HOSTS = ["micollects.firebasestorage.app"];
const isFromRetiredBucket = url => typeof url === "string" && RETIRED_STORAGE_HOSTS.some(h => url.includes(`/b/${h}/o/`));
let cloudUser = null, appReady = false, currentScope = "local", authResolvedOnce = false, welcomeShown = false;
let fbAuth = null, fbDb = null, fbStorage = null;
// pendingInactivitySignOut is computed up top (see its definition for why); consumed in onAuthStateChanged below.
let forceWelcomeNext = false;
if (cloudEnabled) {
  firebase.initializeApp(firebaseConfig);
  fbAuth = firebase.auth(); fbDb = firebase.firestore(); fbStorage = firebase.storage();
}

const AUTH_ERRORS = {
  "auth/invalid-email": "That doesn’t look like a valid email address.",
  "auth/user-not-found": "No account with that email. Tap Create account instead?",
  "auth/wrong-password": "Wrong password.",
  "auth/invalid-credential": "Wrong email or password.",
  "auth/email-already-in-use": "There’s already an account with that email. Tap Sign in instead?",
  "auth/weak-password": "Use at least 6 characters.",
  "auth/too-many-requests": "Too many attempts. Wait a bit, then try again.",
  "auth/network-request-failed": "Couldn’t reach the server. Check your connection."
};
const authErrorMsg = e => AUTH_ERRORS[e && e.code] || (e && e.message) || "Something went wrong.";
function passwordPolicyError(pw) {
  if (pw.length < 8) return "Use at least 8 characters.";
  if (!/[0-9]/.test(pw)) return "Include at least one number.";
  if (!/[^A-Za-z0-9]/.test(pw)) return "Include at least one special character.";
  return null;
}

function cloudSignUp(email, password) { return fbAuth.createUserWithEmailAndPassword(email, password); }
function cloudSignIn(email, password) { return fbAuth.signInWithEmailAndPassword(email, password); }
function cloudSignOut() { return fbAuth.signOut(); }
function cloudResetPassword(email) { return fbAuth.sendPasswordResetEmail(email); }

async function uploadPhoto(itemId, index, dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  const ref = fbStorage.ref(`users/${cloudUser.uid}/items/${itemId}/${index}.jpg`);
  await ref.put(blob, { contentType: "image/jpeg" });
  return ref.getDownloadURL();
}

async function uploadAvatar(dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  const ref = fbStorage.ref(`users/${cloudUser.uid}/avatar.jpg`);
  await ref.put(blob, { contentType: "image/jpeg" });
  return ref.getDownloadURL();
}

async function saveAvatar(dataUrl) {
  const hint = $("#avatarHint");
  if (hint) hint.textContent = "Uploading…";
  try {
    const url = await uploadAvatar(dataUrl);
    settings.avatarUrl = url; saveSettings(); await cloudPushSettings();
    toast("Profile picture updated");
    openSettings();
  } catch (e) { if (hint) hint.textContent = "Couldn’t upload: " + authErrorMsg(e); }
}

/* Uploads any photos not already cached from a previous push (cloudPhotos), then writes the item --
   Firestore keeps the photos as Storage URLs, never the raw base64, to stay well under its 1MB/doc limit. */
async function cloudPushItem(it) {
  if (!cloudEnabled || !cloudUser) return;
  const photos = it.photos || [], cached = it.cloudPhotos || [];
  const urls = [];
  for (let i = 0; i < photos.length; i++) urls.push(cached[i] || await uploadPhoto(it.id, i, photos[i]));
  it.cloudPhotos = urls;
  try { await store.put(it); } catch (e) {}
  const { photos: _p, photo: _ph, cloudPhotos: _cp, ...rest } = it;
  const doc = JSON.parse(JSON.stringify({ ...rest, photos: urls, photo: urls[0] || null }));
  await fbDb.collection("users").doc(cloudUser.uid).collection("items").doc(it.id).set(doc);
  settings.lastSynced = Date.now(); saveSettings();
  const authHint = $("#authHint"); if (authHint) authHint.textContent = "Synced just now.";
}

async function cloudDeleteItem(id) {
  if (!cloudEnabled || !cloudUser) return;
  try { await fbDb.collection("users").doc(cloudUser.uid).collection("items").doc(id).delete(); } catch (e) {}
}

async function cloudPushSettings() {
  if (!cloudEnabled || !cloudUser) return;
  const { lastSynced, ...rest } = settings; // sync timestamp itself stays device-local, never synced
  try { await fbDb.collection("users").doc(cloudUser.uid).collection("meta").doc("settings").set(rest); } catch (e) {}
}

/* Pulls every remote item newer than the local copy, downloads its photos (in parallel, across all
   items at once, rather than one photo at a time -- much faster for a full pull after a fresh
   install), and pushes up any local item the cloud doesn't have yet (covers signing in for the first
   time with existing local items). Each item is isolated in its own try/catch: one item failing to
   store (e.g. hitting a storage quota) used to throw out of the whole loop and silently abandon every
   item after it -- now it's just counted as failed and the rest still go through. */
let cloudSyncing = false;
async function cloudPullAll(silent) {
  if (!cloudEnabled || !cloudUser) return;
  // Snapshot which account this sync belongs to, up front -- cloudUser/currentScope are mutable
  // globals that change the instant the user signs out or switches accounts, and this function keeps
  // running in the background across several awaits. Without this, a sign-out mid-sync makes later
  // store.put() calls below pick up the now-"local" scope live, writing cloud items into local
  // storage instead of the account they actually belong to.
  const syncUid = cloudUser.uid;
  const stillCurrent = () => cloudUser && cloudUser.uid === syncUid;
  const setHint = msg => { const h = $("#authHint"); if (h) h.textContent = msg; };
  if (cloudSyncing) { toast("Already syncing…"); setHint("Already syncing…"); return; }
  cloudSyncing = true;
  $("#settingsBtn").classList.add("syncing");
  if (!silent) toast("Syncing…");
  setHint("Syncing…");
  try {
    const snap = await fbDb.collection("users").doc(syncUid).collection("items").get();
    const toPull = snap.docs.filter(doc => {
      const remote = doc.data();
      const existing = state.items.find(i => i.id === doc.id);
      if (!existing) return true;
      if ((existing.updated || 0) < (remote.updated || 0)) return true;
      // metadata is up to date, but keep retrying if a past pull came back with fewer photos than
      // the cloud actually has for it (e.g. a flaky download last time) -- otherwise that gap is
      // permanent, since nothing else here would ever trigger a re-pull of this item again.
      const remoteUrlCount = Array.isArray(remote.photos) ? remote.photos.length : 0;
      const localPhotoCount = Array.isArray(existing.photos) ? existing.photos.length : 0;
      return localPhotoCount < remoteUrlCount;
    });
    let pulled = 0, failed = 0, lastPhotoError = null;
    await Promise.all(toPull.map(async doc => {
      try {
        const remote = doc.data();
        const urls = Array.isArray(remote.photos) ? remote.photos : [];
        const fetched = (await Promise.all(urls.map(url => fetchImage(url).catch(e => { lastPhotoError = e; return null; })))).filter(Boolean);
        const existing = state.items.find(i => i.id === doc.id);
        // Never overwrite a local copy with fewer photos than it already has -- a failed or partial
        // re-download should lose nothing; keep the existing photos instead of the worse new result.
        const keepExisting = !!existing && (existing.photos || []).length >= fetched.length;
        const photos = keepExisting ? existing.photos : fetched;
        const photo = keepExisting ? existing.photo : (fetched[0] || null);
        const cloudPhotos = keepExisting ? (existing.cloudPhotos || urls) : urls;
        await store.put({ ...remote, id: doc.id, photos, photo, cloudPhotos, scope: syncUid });
        if (urls.length > fetched.length) failed++; else pulled++;
      } catch (e) { failed++; lastPhotoError = e; }
    }));
    // The account that started this sync may no longer be the signed-in one (sign-out, or a switch
    // to a different account) by the time the pulls above finish -- everything pulled is already
    // safely stored under its real owner's scope, but nothing past this point should touch the
    // current screen/state, which now belongs to a different account or to "local".
    if (!stillCurrent()) return;
    const remoteIds = new Set(snap.docs.map(d => d.id));
    for (const it of state.items) {
      if (remoteIds.has(it.id)) continue;
      try { await cloudPushItem(it); } catch (e) {}
    }
    try {
      const metaDoc = await fbDb.collection("users").doc(syncUid).collection("meta").doc("settings").get();
      if (metaDoc.exists) { Object.assign(settings, metaDoc.data()); saveSettings(); } else { await cloudPushSettings(); }
    } catch (e) {}
    if (!stillCurrent()) return;
    state.items = await store.all(syncUid);
    let repaired = 0;
    for (const it of state.items) {
      if (!stillCurrent()) return;
      if ((it.photos || []).length && (it.cloudPhotos || []).some(isFromRetiredBucket)) {
        it.cloudPhotos = [];
        try { await cloudPushItem(it); repaired++; } catch (e) {}
      }
    }
    if (repaired) state.items = await store.all(syncUid);
    render();
    refreshSettingsIfOpen();
    settings.lastSynced = Date.now(); saveSettings();
    const errDetail = lastPhotoError ? ` [${lastPhotoError.status ? "HTTP " + lastPhotoError.status : lastPhotoError.message || "error"}]` : "";
    const msg = failed ? `Synced, but ${failed} ${failed === 1 ? "item" : "items"} didn’t come through${errDetail} — tap Sync now to retry.`
      : pulled ? `Synced — updated ${pulled} ${pulled === 1 ? "item" : "items"}` : "Synced — everything’s up to date";
    if (!silent || failed) toast(msg);
    setHint(`${msg} (just now)`);
  } catch (e) {
    const msg = "Couldn’t sync: " + authErrorMsg(e);
    if (!silent) toast(msg);
    setHint(msg);
  } finally {
    cloudSyncing = false;
    $("#settingsBtn").classList.remove("syncing");
  }
}

/* ---------- Wishlist sharing (public, read-only link) ----------
   A share is a snapshot of the current wishlist written to a top-level "shares/{token}" Firestore
   document -- separate from "users/{uid}/..." so it can be made publicly readable by its exact token
   (an unguessable id) without exposing anything else. Security rules allow "get" (fetch by exact id)
   but not "list" (browse/enumerate), so a token can't be discovered, only used if you already have it. */
const SHARE_BASE_URL = "https://iitzbez.github.io/miCollects/share.html";
const shareUrl = token => `${SHARE_BASE_URL}?id=${token}`;

/* Opens the OS share sheet (native on Android via the Share plugin, the Web Share API in a browser),
   falling back to copying the link to the clipboard if neither is available. */
async function openShareSheet(url, title) {
  const P = window.Capacitor && window.Capacitor.Plugins;
  if (P && P.Share) { try { await P.Share.share({ title, url }); return; } catch (e) { if (/cancel/i.test(String(e && e.message))) return; } }
  try { if (navigator.share) { await navigator.share({ title, url }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch (e) {}
}

async function ensureItemPhotoSynced(it) {
  if ((it.cloudPhotos || []).length < (it.photos || []).length) {
    try { await cloudPushItem(it); } catch (e) {}
  }
}
const shareEntry = it => ({
  name: it.name || "", brand: it.brand || "", category: it.category || "", scale: it.scale || "",
  description: it.description || "", photo: (it.cloudPhotos && it.cloudPhotos[0]) || null, productUrl: it.productUrl || null,
  list: it.list === "owned" ? "owned" : "wish",
  target: it.target ?? null, priority: it.priority || 2,
  condition: it.condition || "", qty: it.qty || 1, value: it.value ?? it.paid ?? null
});
async function pushShareDoc(token, items) {
  await fbDb.collection("shares").doc(token).set({ uid: cloudUser.uid, currency: settings.currency, updated: Date.now(), items });
}
async function deleteShareDoc(token) {
  try { await fbDb.collection("shares").doc(token).delete(); } catch (e) {}
}

async function buildShareItems() {
  const wish = state.items.filter(i => i.list === "wish");
  for (const it of wish) await ensureItemPhotoSynced(it);
  return wish
    .slice()
    .sort((a, b) => (b.priority || 2) - (a.priority || 2) || (a.name || "").localeCompare(b.name || ""))
    .map(shareEntry);
}

async function pushShareSnapshot(token) { await pushShareDoc(token, await buildShareItems()); }

async function createShare() {
  const token = settings.wishlistShareToken || uid();
  await pushShareSnapshot(token);
  settings.wishlistShareToken = token; saveSettings(); await cloudPushSettings();
}

/* Fire-and-forget: keeps an already-active share link fresh whenever the wishlist changes. A no-op
   when sharing isn't on, so it's safe to call after every save/delete regardless. */
async function refreshShareIfActive() {
  if (!cloudEnabled || !cloudUser || !settings.wishlistShareToken) return;
  try { await pushShareSnapshot(settings.wishlistShareToken); } catch (e) {}
}

async function revokeShare() {
  if (!settings.wishlistShareToken) return;
  await deleteShareDoc(settings.wishlistShareToken);
  settings.wishlistShareToken = null; saveSettings(); await cloudPushSettings();
}

/* ---------- Single-item sharing (same shares/{token} mechanism, one item in "items") ---------- */
async function pushItemShareSnapshot(token, it) {
  await ensureItemPhotoSynced(it);
  await pushShareDoc(token, [shareEntry(it)]);
}

async function createItemShare(it) {
  const token = it.shareToken || uid();
  await pushItemShareSnapshot(token, it);
  it.shareToken = token;
  try { await store.put(it); } catch (e) {}
  const idx = state.items.findIndex(i => i.id === it.id);
  if (idx >= 0) state.items[idx] = { ...it };
  cloudPushItem(it).catch(() => {});
}

async function refreshItemShareIfActive(it) {
  if (!cloudEnabled || !cloudUser || !it.shareToken) return;
  try { await pushItemShareSnapshot(it.shareToken, it); } catch (e) {}
}

async function revokeItemShare(it) {
  if (!it.shareToken) return;
  await deleteShareDoc(it.shareToken);
  it.shareToken = null;
  try { await store.put(it); } catch (e) {}
  const idx = state.items.findIndex(i => i.id === it.id);
  if (idx >= 0) state.items[idx] = { ...it };
  cloudPushItem(it).catch(() => {});
}

/* ---------- Pick-and-share: a one-off snapshot of just the selected items, shared immediately.
   No "manage this link" UI -- a fresh token each time, same as sharing a photo. */
async function shareItemsNow(items) {
  for (const it of items) await ensureItemPhotoSynced(it);
  const owned = items[0] && items[0].list === "owned";
  const sorted = items.slice().sort(owned
    ? (a, b) => (a.name || "").localeCompare(b.name || "")
    : (a, b) => (b.priority || 2) - (a.priority || 2) || (a.name || "").localeCompare(b.name || ""));
  const token = uid();
  await pushShareDoc(token, sorted.map(shareEntry));
  const title = items.length === 1 ? (items[0].name || "Item")
    : `My miCollects ${owned ? "collection" : "wishlist"} (${items.length} items)`;
  await openShareSheet(shareUrl(token), title);
}

function refreshSettingsIfOpen() {
  if (sheetOpen && $("#sheetTitle") && $("#sheetTitle").textContent === "Settings") openSettings();
}

/* Items are partitioned by `scope` (see store.all above): switching accounts, or signing out back to
   "local", swaps which partition `state.items` shows, so one account's synced items never leak into
   another account's view or the signed-out local-only view. */
function maybeShowWelcome(force) {
  if (!appReady || (cloudEnabled && !authResolvedOnce)) return;
  if (!force && welcomeShown) return;
  if (force || !settings.onboarded) { welcomeShown = true; showWelcome(); }
}
if (cloudEnabled) {
  fbAuth.onAuthStateChanged(async user => {
    if (user && pendingInactivitySignOut) {
      pendingInactivitySignOut = false;
      forceWelcomeNext = true;
      try { await fbAuth.signOut(); } catch (e) {}
      return; // the resulting null-user call below finishes the job
    }
    cloudUser = user;
    currentScope = user ? user.uid : "local";
    if (appReady) { state.items = await store.all(currentScope); render(); }
    if (appReady && user) cloudPullAll(true);
    refreshSettingsIfOpen();
    if (!authResolvedOnce) { authResolvedOnce = true; if (user) { settings.onboarded = true; saveSettings(); } }
    // The startup hold (see pendingInactivitySignOut above) is resolved now -- hide #welcome, unless
    // we're about to force it open right below, which would just flash it hidden then shown again.
    if (!forceWelcomeNext) hideWelcomeIfOnboarded();
    maybeShowWelcome(forceWelcomeNext);
    forceWelcomeNext = false;
  });
}

/* ---------- Settings + backup ---------- */
const isValidEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);

function authAreaHtml() {
  if (!authMode) {
    return `
    <p class="hint">Sign in to back up your collection to the cloud and sync it automatically to another device, and manage your account settings.</p>
    <div class="actions">
      <button class="btn primary" id="showSignInBtn">Sign in</button>
      <button class="btn ghost" id="showSignUpBtn">Create account</button>
    </div>`;
  }
  const signUp = authMode === "signup";
  return `
    <div class="field"><label for="s-email">Email</label>
      <input id="s-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label for="s-pass">Password</label>
      <input id="s-pass" name="password" type="password" autocomplete="${signUp ? "new-password" : "current-password"}" placeholder="${signUp ? "8+ chars, a number, a symbol" : "Your password"}"></div>
    <div class="actions">
      <button class="btn primary" id="${signUp ? "signUpBtn" : "signInBtn"}">${signUp ? "Create account" : "Sign in"}</button>
      <button class="btn ghost" id="authBackBtn">Back</button>
    </div>
    ${!signUp ? `<button type="button" class="link plain" id="forgotBtn">Forgot password?</button>` : ""}
    <p class="hint auth-msg" id="authHint"></p>`;
}

  return `

      <div class="avatar" id="avatarPreview">${settings.avatarUrl ? `<img src="${esc(settings.avatarUrl)}" alt="">` : `<span>${esc(initials)}</span>`}</div>
      <div class="avatar-actions">
        <button type="button" class="btn ghost" id="avatarBtn">Change photo</button>

      </div>

    <p class="hint" id="avatarHint"></p>

  return `
    <h3>Photo recognition</h3>
    <p class="hint">To auto-fill details from a photo (Image Recognition), paste in a free Gemini API key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Without one, photos are still added, just not recognised.</p>
    <div class="field"><label for="s-gemini">Gemini API key</label>
      <div class="url-row">
        <input id="s-gemini" type="password" value="${esc(settings.geminiKey)}" placeholder="Paste your API key" autocomplete="off">
        <button type="button" class="btn primary" id="geminiSaveBtn">Save</button>

function openSettings() {
  const tabs = cloudUser
    ? [["account", "My Account"], ["general", "General"], ["api", "API"]]
    : [["account", "Account"], ["general", "General"]];
  if (!tabs.some(([k]) => k === settingsTab)) settingsTab = cloudUser ? "account" : "general";
  const tabBody = settingsTab === "account"
    ? (cloudUser ? accountTabHtml() : !cloudEnabled ? `<p class="hint">Cloud sync isn’t set up for this build yet.</p>` : authAreaHtml())
    : settingsTab === "api" ? apiTabHtml() : generalTabHtml();
  $("#sheetBody").innerHTML = `
    <h2 id="sheetTitle">Settings</h2>
    <div class="settings-tabs" id="settingsTabs" role="tablist">
      ${tabs.map(([k, l]) => `<button type="button" class="stab" data-stab="${k}" role="tab" aria-selected="${settingsTab === k}">${esc(l)}</button>`).join("")}
    </div>
    <div id="settingsTabBody">${tabBody}</div>
    <div class="actions done-row"><button class="btn primary" id="sDone">Done</button></div>`;

  $("#settingsTabs").addEventListener("click", e => {
    const b = e.target.closest("[data-stab]"); if (!b || b.dataset.stab === settingsTab) return;
    settingsTab = b.dataset.stab; authMode = null; openSettings();
  });

  if (settingsTab === "account" && cloudEnabled && !cloudUser) {
    if (!authMode) {
      $("#showSignInBtn").addEventListener("click", () => { authMode = "signin"; openSettings(); });
      $("#showSignUpBtn").addEventListener("click", () => { authMode = "signup"; openSettings(); });
    } else {
      const authHint = $("#authHint");
      $("#authBackBtn").addEventListener("click", () => { authMode = null; openSettings(); });
      const authAction = async (fn, okMsg, requirePolicy) => {
        const email = $("#s-email").value.trim(), pass = $("#s-pass").value;
        if (!email || !pass) { authHint.textContent = "Enter an email and password."; return; }
        if (!isValidEmail(email)) { authHint.textContent = "Enter a valid email address."; return; }
        if (requirePolicy) { const err = passwordPolicyError(pass); if (err) { authHint.textContent = err; return; } }
        authHint.textContent = "Working…";
        try { await fn(email, pass); toast(okMsg); authMode = null; } catch (e) { authHint.textContent = authErrorMsg(e); }
      };
      if (authMode === "signin") $("#signInBtn").addEventListener("click", () => authAction(cloudSignIn, "Signed in", false));
      if (authMode === "signup") $("#signUpBtn").addEventListener("click", () => authAction(cloudSignUp, "Account created", true));
      const forgotBtn = $("#forgotBtn");
      if (forgotBtn) forgotBtn.addEventListener("click", async () => {
        const email = $("#s-email").value.trim();
        if (!email) { authHint.textContent = "Enter your email first."; return; }
        if (!isValidEmail(email)) { authHint.textContent = "Enter a valid email address."; return; }
        try { await cloudResetPassword(email); authHint.textContent = "Check your email for a reset link."; }
        catch (e) { authHint.textContent = authErrorMsg(e); }
      });
    }
  }

  if (settingsTab === "account") {
    if (cloudUser) {
      $("#signOutBtn").addEventListener("click", () => cloudSignOut());
      $("#avatarBtn").addEventListener("click", async () => {
        const hint = $("#avatarHint");
        const P = window.Capacitor && window.Capacitor.Plugins;
        if (P && P.Camera) {
          const source = await pickPhotoSource();
          if (!source) return;
          try {
            const shot = await P.Camera.getPhoto({ quality: 80, resultType: "base64", source, saveToGallery: false });
            if (!shot || !shot.base64String) return;
            const compressed = await compressSrc(`data:image/${shot.format || "jpeg"};base64,${shot.base64String}`);
            await saveAvatar(compressed);
          } catch (e) { if (!/cancel/i.test(String(e && e.message))) hint.textContent = "Couldn’t get that photo."; }
        } else {
          $("#avatarIn").click();
        }
      });
      $("#avatarIn").addEventListener("change", async e => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        try { const compressed = await compress(f); await saveAvatar(compressed); }
        catch (err) { $("#avatarHint").textContent = err.message || "That photo couldn’t be used."; }
        e.target.value = "";
      });
      const avatarRemove = $("#avatarRemoveBtn");
      if (avatarRemove) avatarRemove.addEventListener("click", async () => {
        try { await fbStorage.ref(`users/${cloudUser.uid}/avatar.jpg`).delete(); } catch (e) {}
        settings.avatarUrl = ""; saveSettings(); await cloudPushSettings();
        toast("Profile picture removed"); openSettings();
      });
      $("#acctSaveBtn").addEventListener("click", async () => {
        settings.firstName = $("#s-fname").value.trim();
        settings.lastName = $("#s-lname").value.trim();
        settings.phone = $("#s-phone").value.trim();
        saveSettings();
        const hint = $("#acctHint"); hint.textContent = "Saving…";
        try { await cloudPushSettings(); hint.textContent = "Saved."; toast("Account details saved"); }
        catch (e) { hint.textContent = "Saved here, but couldn’t sync."; }
      });
      $("#acctResetBtn").addEventListener("click", async () => {
        const hint = $("#acctResetHint"); hint.textContent = "Sending…";
        try { await cloudResetPassword(cloudUser.email); hint.textContent = "Check your email for a reset link."; }
        catch (e) { hint.textContent = "Couldn’t send: " + authErrorMsg(e); }
      });
    }
  } else if (settingsTab === "general") {
    const syncBtn = $("#syncBtn");
    if (syncBtn) syncBtn.addEventListener("click", () => cloudPullAll());
    $("#s-cur").addEventListener("input", e => { settings.currency = e.target.value; saveSettings(); render(); cloudPushSettings(); });
    $("#s-theme").addEventListener("click", () => openPicker("Theme", THEME_OPTIONS, settings.theme, v => {
      settings.theme = v; saveSettings(); applyTheme(); openSettings();
    }));
    $("#expBtn").addEventListener("click", exportBackup);
    $("#impIn").addEventListener("change", importBackup);
    const wipe = $("#wipeBtn");
    wipe.addEventListener("click", () => armThen(wipe, "Tap again to delete all items", async () => {
      const ids = state.items.map(i => i.id);
      for (const id of ids) await store.del(id);
      state.items = []; closeSheet(); render(); toast("All items deleted");
      ids.forEach(cloudDeleteItem);
      refreshShareIfActive();
    }));
  } else if (settingsTab === "api" && cloudUser) {
    $("#s-gemini").addEventListener("input", e => { settings.geminiKey = e.target.value.trim(); });
    $("#s-gemini").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#geminiSaveBtn").click(); } });
    $("#geminiSaveBtn").addEventListener("click", async () => {
      settings.geminiKey = $("#s-gemini").value.trim(); saveSettings();
      const hint = $("#geminiHint");
      if (cloudUser) { hint.textContent = "Saving…"; await cloudPushSettings(); hint.textContent = "Saved."; }
      else hint.textContent = "Saved.";
      toast("API key saved");
    });
  }
  $("#sDone").addEventListener("click", closeSheet);
  addClearButtons($("#sheetBody"));
  addPasswordToggles($("#sheetBody"));
  showSheet();
}

async function exportBackup() {
  const data = JSON.stringify({ app: "cabinet", version: 1, exported: new Date().toISOString(), settings, items: state.items });
  const name = `micollects-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const P = window.Capacitor && window.Capacitor.Plugins;
  if (P && P.Filesystem && P.Share) {
    try {
      const r = await P.Filesystem.writeFile({ path: name, data, directory: "CACHE", encoding: "utf8" });
      await P.Share.share({ title: "miCollects backup", url: r.uri, dialogTitle: "Save your backup" });
      return;
    } catch (e) { if (/cancel/i.test(String(e && e.message))) return; }
  }
  try {
    const file = new File([data], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "miCollects backup" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(data); toast("Backup copied. Paste it into a note or email to keep it."); return; }
  catch (e) {}
  $("#backupOut").innerHTML = `<p class="hint">Copy this text and keep it somewhere safe:</p><textarea class="backup-text" readonly>${esc(data)}</textarea>`;
  const ta = $("#backupOut textarea"); ta.focus(); ta.select();
}

async function importBackup(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const parsed = JSON.parse(await f.text());
    const items = Array.isArray(parsed) ? parsed : parsed.items;
    if (!Array.isArray(items)) throw new Error("bad");
    let n = 0;
    for (const raw of items) {
      if (!raw || !raw.name || !["owned", "wish"].includes(raw.list)) continue;
      const it = { ...raw, id: raw.id || uid(), scope: currentScope };
      const existing = state.items.find(i => i.id === it.id);
      if (existing && (existing.updated || 0) > (it.updated || 0)) continue;
      await store.put(it); n++;
    }
    if (parsed.settings && typeof parsed.settings === "object") { Object.assign(settings, parsed.settings); saveSettings(); }
    state.items = await store.all(currentScope);
    closeSheet(); render();
    toast(n ? `Imported ${n} ${n === 1 ? "item" : "items"}` : "Nothing new in that backup");
    if (n && cloudUser) cloudPullAll(true);
  } catch (err) {
    toast("That file isn’t a miCollects backup.");
  }
  e.target.value = "";
}

/* ---------- Events ---------- */
/* Long-press (hold ~500ms without moving) on a card enters multi-select mode with that card
   pre-selected -- Share and Delete are both available from there, on either tab. A synthetic
   "click" still fires on release after a long-press in most browsers; longPressFired lets the
   click handler below swallow that one so it doesn't also open the item. */
let pressTimer = null, longPressFired = false, pressStart = null;
const LONG_PRESS_MS = 500, MOVE_CANCEL_PX = 10;
function cancelLongPress() { clearTimeout(pressTimer); pressTimer = null; pressStart = null; }
$("#grid").addEventListener("pointerdown", e => {
  if (state.selecting) return;
  const c = e.target.closest(".card"); if (!c) return;
  pressStart = { x: e.clientX, y: e.clientY };
  pressTimer = setTimeout(() => {
    longPressFired = true;
    enterSelectMode([c.dataset.id]);
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
  }, LONG_PRESS_MS);
});
$("#grid").addEventListener("pointermove", e => {
  if (!pressStart) return;
  if (Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > MOVE_CANCEL_PX) cancelLongPress();
});
$("#grid").addEventListener("pointerup", cancelLongPress);
$("#grid").addEventListener("pointercancel", cancelLongPress);
$("#grid").addEventListener("click", e => {
  if (longPressFired) { longPressFired = false; return; }
  if (e.target.closest("[data-add]")) { openForm(null); return; }
  const got = e.target.closest("[data-got]");
  if (got && !state.selecting) { e.stopPropagation(); openForm(state.items.find(i => i.id === got.dataset.got), "owned"); return; }
  const c = e.target.closest(".card");
  if (!c) return;
  if (state.selecting && c.classList.contains("selecting")) {
    const id = c.dataset.id;
    if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
    render();
    return;
  }
  if (!state.selecting) openForm(state.items.find(i => i.id === c.dataset.id));
});
$("#grid").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")) { e.preventDefault(); e.target.click(); }
});
$("#chips").addEventListener("click", e => { const b = e.target.closest("[data-pillval]"); if (b) { state.pillVal = b.dataset.pillval; render(); } });
$("#catChips").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if (!b || b.dataset.cat === state.cat) return;
  state.cat = b.dataset.cat; state.pillVal = "All"; render();
});
$("#pillField").addEventListener("click", e => {
  const b = e.target.closest("[data-pillfield]"); if (!b || b.dataset.pillfield === state.pillField) return;
  state.pillField = b.dataset.pillfield; state.pillVal = "All"; render();
});
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#sortBtn").addEventListener("click", () => openPicker("Sort by", sortOptions, state.sort, v => {
  state.sort = settings.sort = v; saveSettings(); render(); cloudPushSettings();
}));
$("#groupBtn").addEventListener("click", () => openPicker("Group by", groupOptions, state.group, v => {
  state.group = settings.group = v; saveSettings(); render(); cloudPushSettings();
}));
$("#layoutBar").addEventListener("click", e => {
  const b = e.target.closest("[data-layout]");
  if (b) { state.layout = settings.layout = b.dataset.layout; saveSettings(); render(); cloudPushSettings(); return; }
});
$("#selectAllBtn").addEventListener("click", () => {
  const visIds = visible().map(i => i.id);
  const allSelected = visIds.length > 0 && visIds.every(id => state.selected.has(id));
  state.selected = allSelected ? new Set() : new Set(visIds);
  render();
});
$("#selectShareBtn").addEventListener("click", async () => {
  if (!state.selected.size) { toast("Select at least one item"); return; }
  const btn = $("#selectShareBtn"); btn.disabled = true;
  try {
    const items = state.items.filter(i => state.selected.has(i.id));
    await shareItemsNow(items);
    exitSelectModeAndPop();
  } catch (e) { toast("Couldn’t share: " + authErrorMsg(e)); btn.disabled = false; }
});
$("#selectBulkBtn").addEventListener("click", () => {
  if (!state.selected.size) { toast("Select at least one item"); return; }
  openBulkUpdate();
});
$("#selectDeleteBtn").addEventListener("click", async () => {
  if (!state.selected.size) { toast("Select at least one item"); return; }
  if (!confirm("Are you sure you want to delete these items?")) return;
  const ids = [...state.selected];
  for (const id of ids) {
    const it = state.items.find(i => i.id === id);
    if (it && it.shareToken) deleteShareDoc(it.shareToken);
    await store.del(id);
  }
  state.items = state.items.filter(i => !state.selected.has(i.id));
  exitSelectModeAndPop();
  toast(`Deleted ${ids.length} ${ids.length === 1 ? "item" : "items"}`);
  ids.forEach(cloudDeleteItem);
  refreshShareIfActive();
});
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (state.tab === b.dataset.tab) return;
  exitSelectModeAndPop();
  state.tab = b.dataset.tab; state.cat = "All"; state.pillField = "all"; state.pillVal = "All"; render(); scrollTo({ top: 0 });
}));
$("#addBtn").addEventListener("click", () => openForm(null));
$("#settingsBtn").addEventListener("click", openSettings);

/* ---------- Welcome (first launch) ---------- */
function showWelcome() {
  $("#welcome").hidden = false;
  $("#wSignIn").hidden = $("#wSignUp").hidden = !cloudEnabled;
  // Always reset to the plain choice screen -- this can be called while the sign-in/up form is
  // already open (e.g. a forced sign-out mid-session), and leaving that form up is what let it
  // show stacked underneath the choices instead of being replaced by them.
  $("#welcomeForm").hidden = true;
  $("#wfHint").textContent = "";
  setTimeout(() => { $("#welcomeChoices").hidden = false; }, 1000);
}
function finishWelcome() { settings.onboarded = true; saveSettings(); $("#welcome").hidden = true; }
$("#wLocal").addEventListener("click", finishWelcome);
$("#wLocalHintBtn").addEventListener("click", () => {
  const h = $("#wLocalHint");
  const show = h.hidden;
  h.hidden = !show;
  $("#wLocalHintBtn").setAttribute("aria-expanded", String(show));
});
$("#wSignIn").addEventListener("click", () => openWelcomeForm("signin"));
$("#wSignUp").addEventListener("click", () => openWelcomeForm("signup"));
$("#wfBack").addEventListener("click", () => {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $("#welcomeForm").hidden = true; $("#welcomeChoices").hidden = false;
});
function openWelcomeForm(mode) {
  /* Blur whatever's focused (the Sign in/Create account button just tapped) before hiding it --
     hiding a still-focused element can leave the WebView's keyboard/focus state confused, so the
     next tap on the email field only clears that stale state instead of opening the keyboard,
     and a second tap is what actually focuses it. */
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $("#welcomeChoices").hidden = true;
  $("#welcomeForm").hidden = false;
  $("#wfHint").textContent = "";
  $("#wfTitle").textContent = mode === "signin" ? "Sign in" : "Create account";
  $("#wfSubmit").textContent = mode === "signin" ? "Sign in" : "Create account";
  $("#wfForgot").hidden = mode !== "signin";
  $("#wfSubmit").onclick = async () => {
    const email = $("#wf-email").value.trim(), pass = $("#wf-pass").value;
    const hint = $("#wfHint");
    if (!email || !pass) { hint.textContent = "Enter an email and password."; return; }
    if (!isValidEmail(email)) { hint.textContent = "Enter a valid email address."; return; }
    if (mode === "signup") { const err = passwordPolicyError(pass); if (err) { hint.textContent = err; return; } }
    hint.textContent = "Working…";
    try { await (mode === "signin" ? cloudSignIn(email, pass) : cloudSignUp(email, pass)); finishWelcome(); }
    catch (e) { hint.textContent = authErrorMsg(e); }
  };
  $("#wfForgot").onclick = async () => {
    const email = $("#wf-email").value.trim();
    const hint = $("#wfHint");
    if (!email) { hint.textContent = "Enter your email first."; return; }
    if (!isValidEmail(email)) { hint.textContent = "Enter a valid email address."; return; }
    try { await cloudResetPassword(email); hint.textContent = "Check your email for a reset link."; }
    catch (e) { hint.textContent = authErrorMsg(e); }
  };
}

/* ---------- Start ---------- */
addClearButtons(document.body);
addPasswordToggles(document.body);
(async () => {
  await store.open();
  try { state.items = await store.all(currentScope); } catch (e) { state.items = []; }
  render();
  if (!store.db) toast("Storage is unavailable, so items won’t be kept after closing.");
  appReady = true;
  // Without cloud sync there's no onAuthStateChanged to resolve the startup hold above -- nothing
  // can ever force a sign-out, so it's always safe to hide #welcome here if it's still showing.
  if (!cloudEnabled) hideWelcomeIfOnboarded();
  if (cloudUser) cloudPullAll(true);
  maybeShowWelcome();
})();
</script>
