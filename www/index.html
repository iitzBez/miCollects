<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<title>miCollects</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--sunk:#F1F4F8;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --brass:#2563EB;--brass-ink:#FFFFFF;--wish:#2563EB;--danger:#DC2626;--star:#F59E0B;--scrim:rgba(15,23,42,.45);
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141C;--surface:#171D27;--sunk:#1F2632;--ink:#F1F5F9;--muted:#94A3B8;--line:#2A3342;
    --brass:#3B82F6;--brass-ink:#FFFFFF;--wish:#60A5FA;--danger:#F87171;--star:#FBBF24;--scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141C;--surface:#171D27;--sunk:#1F2632;--ink:#F1F5F9;--muted:#94A3B8;--line:#2A3342;
  --brass:#3B82F6;--brass-ink:#FFFFFF;--wish:#60A5FA;--danger:#F87171;--star:#FBBF24;--scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
img{max-width:100%}

/* Header */
.top{padding:20px 16px 6px;display:flex;align-items:flex-start;gap:12px;max-width:1100px;margin:0 auto}
.top-text{flex:1;min-width:0}
h1{font:800 clamp(30px,8vw,40px)/1.05 var(--display);letter-spacing:-.025em;margin:0}
#stats{margin:6px 0 0;color:var(--muted);font-size:14px;min-height:20px}
.brand{margin:0 0 6px;font:800 15px/1 var(--display);letter-spacing:-.01em;color:var(--ink)}
.brand span{color:var(--brass)}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn.syncing::after{content:"";position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 2px var(--surface);animation:syncPulse 1s ease-in-out infinite}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.icon-btn.syncing::after{animation:none}}
.icon-btn svg{width:20px;height:20px}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 4px;max-width:1100px;margin:0 auto}
.search{flex:1 1 100%;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid transparent;background:var(--sunk);padding:0 12px 0 38px}
input[type="search"]::-webkit-search-cancel-button,input[type="search"]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.icon-select:first-of-type{margin-left:auto}
.layout-bar{display:flex;gap:6px;padding:4px 16px 8px;max-width:1100px;margin:0 auto}
.lbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--muted)}
.lbtn svg{width:18px;height:18px}
.lbtn[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.lbtn:disabled{opacity:.4;pointer-events:none}
.lbtn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.lbtn.accent{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
#signOutBtn{margin-left:auto}
.select-bar{display:flex;align-items:center;gap:10px;padding:6px 16px 10px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.select-bar .select-count{color:var(--muted);font-size:14px;flex:1}
#selectShareBtn, #selectBulkBtn, #selectDeleteBtn{margin-left:auto}
.sel-dot{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(15,23,42,.35);box-shadow:0 1px 3px rgba(15,23,42,.3);z-index:1}
.card.selected .sel-dot{background:var(--brass);border-color:var(--brass)}
.card.selected .sel-dot::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.card.selecting{cursor:pointer}
.card.selecting .got{display:none}
.pill-field{display:flex;gap:6px;padding:8px 16px 0;max-width:1100px;margin:0 auto}
.pill-field button{height:26px;padding:0 12px;border-radius:13px;border:1px solid var(--line);background:transparent;font-size:12px;font-weight:650;color:var(--muted);cursor:pointer}
.pill-field button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 4px;scrollbar-width:none;max-width:1100px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:26px;padding:0 12px;border-radius:13px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12px;font-weight:650;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px calc(150px + env(safe-area-inset-bottom,0px));max-width:1100px;margin:0 auto}
.grid.cols-1{grid-template-columns:1fr}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.06);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left}
/* List view: a single row per item — image, name, price */
.grid.view-list{display:flex;flex-direction:column;gap:8px}
.grid.view-list .card{flex-direction:row;align-items:center;gap:12px}
.grid.view-list .ph{width:56px;height:56px;flex:none;border-radius:10px;aspect-ratio:auto}
.grid.view-list .qty{font-size:11px;padding:1px 6px;top:4px;right:4px}
.grid.view-list .cb{flex-direction:row;align-items:center;flex:1;min-width:0;padding:10px 12px 10px 0;gap:10px}
.grid.view-list .nm{flex:1;min-width:0;-webkit-line-clamp:1}
.grid.view-list .mt{display:none}
.grid.view-list .ft{margin-top:0;flex:none;gap:8px}
.grid.view-list .ft>span:first-child{display:none}
.grid.view-list .got{margin-top:0;width:auto;height:34px;padding:0 14px;flex:none}
.ph{aspect-ratio:1;background:var(--sunk);position:relative;display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.initial{font:800 56px/1 var(--display);color:var(--muted);opacity:.55}
.qty{position:absolute;top:8px;right:8px;background:var(--brass);color:var(--brass-ink);font-weight:700;font-size:13px;padding:2px 8px;border-radius:10px}
/* Wishlist items are drawn as empty slots: dashed outline around a full-colour photo */
.card.wish .ph{background:transparent}
.card.wish .ph::after{content:"";position:absolute;inset:8px;border:2px dashed var(--wish);border-radius:10px;pointer-events:none}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-weight:650;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft{display:flex;justify-content:space-between;gap:6px;font-size:13px;margin-top:auto;padding-top:4px}
.ft .val{font-weight:650}
.pri{font-weight:600}
.pri.p3{color:var(--danger)}.pri.p2{color:#D97706}.pri.p1{color:var(--muted)}
.got{margin-top:8px;height:36px;border-radius:10px;border:0;color:var(--brass-ink);background:var(--brass);font-weight:650;font-size:14px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted)}
.empty h2{font:700 22px/1.2 var(--display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto 18px;max-width:34ch}
.group-head{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 2px 2px;padding-top:14px;border-top:1px solid var(--line);font:700 12px/1.2 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.group-head:first-child{margin-top:0;padding-top:0;border-top:0}
.group-count{font-weight:700;background:var(--sunk);border-radius:9px;padding:1px 7px;font-size:11px;text-transform:none;letter-spacing:0}

/* Bottom nav + add button */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;height:62px;border:0;background:transparent;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);position:relative;display:flex;align-items:center;justify-content:center;gap:6px}
.nav button[aria-selected="true"]{color:var(--brass)}
.nav button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brass)}
.nav .count{font-size:12px;font-weight:700;background:var(--sunk);border-radius:9px;padding:1px 7px;color:var(--muted)}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--brass);color:var(--brass-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(37,99,235,.35);z-index:6}
.fab svg{width:26px;height:26px}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));z-index:11;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.picker-sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:420px;max-height:80vh;max-height:80dvh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 10px calc(20px + env(safe-area-inset-bottom,0px));z-index:11;animation:up .22s ease-out}
@media (prefers-reduced-motion:reduce){.picker-sheet{animation:none}}
.picker-sheet h2{font:700 18px/1.3 var(--display);letter-spacing:-.01em;margin:0 8px 8px;padding:0 0 14px;border-bottom:1px solid var(--line)}
.picker-opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border:0;background:none;border-radius:14px;font-size:15px;font-weight:650;color:var(--ink);text-align:left;cursor:pointer;margin-bottom:4px;transition:background .15s}
.picker-opt:active{transform:scale(.98)}
.picker-opt .ic{width:34px;height:34px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--muted);transition:all .15s}
.picker-opt .ic svg{width:17px;height:17px}
.picker-opt .lbl{flex:1}
.picker-opt .check{width:20px;height:20px;flex:none;opacity:0;transform:scale(.6);transition:all .15s;color:var(--brass)}
.picker-opt[aria-checked="true"]{background:linear-gradient(135deg,rgba(37,99,235,.16),rgba(37,99,235,.06))}
.picker-opt[aria-checked="true"] .ic{background:var(--brass);color:var(--brass-ink)}
.picker-opt[aria-checked="true"] .check{opacity:1;transform:scale(1)}
.select-btn{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px;font-family:inherit;text-align:left;color:var(--ink);cursor:pointer}
.select-btn svg{width:18px;height:18px;color:var(--muted);flex:none}
.sheet h2{font:700 24px/1.2 var(--display);letter-spacing:-.015em;margin:0 0 14px}
.sheet h3{font:700 17px/1.3 var(--display);margin:26px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
.field{margin-bottom:14px;position:relative}
.avatar-row{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;overflow:hidden;flex:none;font:700 24px/1 var(--display);color:var(--muted)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px}
.field textarea{resize:vertical;min-height:84px}
.ac-list{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.18);max-height:180px;overflow-y:auto;z-index:5}
.ac-list li{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.ac-list li:hover,.ac-list li.active{background:var(--sunk)}
.clearable{position:relative}
input.has-marquee::placeholder{color:transparent}
.ph-text{position:absolute;left:12px;right:12px;top:0;bottom:0;display:flex;align-items:center;overflow:hidden;pointer-events:none;color:var(--muted);font-size:inherit}
.ph-run{display:inline-block;white-space:nowrap;transform:translateX(0)}
.ph-run.ph-scroll{animation:ph-scroll 10s ease-in-out infinite}
/* ~5s scrolling, then ~5s paused at the reset position before it scrolls again. */
@keyframes ph-scroll{0%,7.5%{transform:translateX(0)}42.5%,50%{transform:translateX(var(--ph-dist,0px))}50.01%,100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.ph-run.ph-scroll{animation:none}}
.clearable input,.clearable textarea{padding-right:34px}
.clearable.has-pw input{padding-right:64px}
.clear-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;border-radius:50%;display:grid;place-items:center}
.clear-btn:hover{background:var(--sunk)}
.clearable.ta .clear-btn{top:10px;transform:none}
.pw-toggle{position:absolute;right:32px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:50%;display:grid;place-items:center}
.pw-toggle:hover{background:var(--sunk)}
.pw-toggle svg{width:18px;height:18px}
.url-row .clearable{flex:1;min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint.bu-intro{margin-bottom:16px}
.star-rating{display:flex;gap:4px}
.star-btn{background:none;border:0;padding:4px;margin:-4px;cursor:pointer;position:relative;display:inline-grid}
.star-btn svg{width:28px;height:28px;display:block;stroke-linejoin:round}
.star-outline{fill:none;stroke:var(--line);stroke-width:1.5}
.star-fill{position:absolute;top:4px;left:4px;fill:var(--star);stroke:none;clip-path:inset(0 100% 0 0)}
.star-btn[data-state="half"] .star-fill{clip-path:inset(0 50% 0 0)}
.star-btn[data-state="full"] .star-fill{clip-path:inset(0 0 0 0)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.auth-msg:not(:empty){text-align:center;color:var(--danger);font-weight:600}
.hint.warn{color:var(--wish);font-weight:600}
.url-box{background:var(--sunk);border-radius:14px;padding:12px;margin-bottom:16px}
.url-box label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.url-row{display:flex;gap:8px;align-items:center}
.url-row input{flex:1;width:100%;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
.url-row .clearable input{padding-right:34px}
.url-row .clearable.has-pw input{padding-right:64px}
.url-row .btn.primary, .url-row .btn.ghost{flex:none;min-height:34px;padding:0 10px;font-size:13px}
.url-box .hint a{color:var(--brass);font-weight:600}
.btn[disabled]{opacity:.6;cursor:progress}
.photo-main{aspect-ratio:16/10;border-radius:14px;background:var(--sunk);overflow:hidden;display:grid}
.photo-main img{width:100%;height:100%;object-fit:contain;display:block}
.photo-empty{display:grid;place-items:center;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-weight:600;cursor:pointer;margin-bottom:14px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 14px}
.thumb{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;position:relative;border:2px solid transparent;background:var(--sunk)}
.thumb.main{border-color:var(--brass)}
.thumb button[data-main]{all:unset;display:block;width:100%;height:100%;cursor:pointer}
.thumb button[data-main]:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(15,23,42,.72);color:#fff;font-size:14px;line-height:22px;padding:0;cursor:pointer}
.thumb.add{display:grid;place-items:center;border:2px dashed var(--line);color:var(--muted);font-size:26px;cursor:pointer}
.link{border:0;background:none;color:var(--danger);padding:4px 0 10px;cursor:pointer;font-size:14px;font-weight:600}
.link.plain{color:var(--brass)}
.actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
#showSignInBtn,#showSignUpBtn{flex:1}
.btn{min-height:48px;padding:0 20px;border-radius:12px;font-weight:650;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--brass);color:var(--brass-ink);flex:1}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.disabled{opacity:.4;pointer-events:none}
.done-row{margin-top:22px;justify-content:center}
.done-row .btn{flex:none;min-height:48px;padding:0 44px}
.btn svg{width:18px;height:18px;flex:none}
.cam-row{display:flex;gap:8px;margin-top:10px}
.cam-row .btn{flex:1}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.more{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.more .btn{flex:1}
.backup-text{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;margin-top:10px}

.settings-tabs{display:flex;gap:4px;margin:4px 0 18px;border-bottom:1px solid var(--line)}
.stab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;font:650 14px/1.2 var(--body);color:var(--muted);cursor:pointer}
.stab[aria-selected="true"]{color:var(--brass);border-bottom-color:var(--brass)}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Welcome / sign-in splash (first launch only) */
.welcome{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center}
.welcome-logo{font:800 clamp(32px,10vw,44px)/1 var(--display);letter-spacing:-.03em;color:var(--ink);margin:0;animation:wlogo .6s ease-out}
.welcome-logo span{color:var(--brass)}
@keyframes wlogo{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.welcome-choices,.welcome-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.welcome-choices{opacity:0;animation:wfade .4s ease-out forwards}
@keyframes wfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.welcome-form{text-align:left}
.welcome-form h2{font:700 22px/1.2 var(--display);margin:0 0 4px;text-align:center}
.welcome .btn{width:100%}
.local-row{display:flex;align-items:center;justify-content:center;gap:6px}
.hint-btn{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
#wLocalHint{text-align:center}
@media (prefers-reduced-motion:reduce){.welcome-logo,.welcome-choices,.welcome-form{animation:none;opacity:1}}

<div class="welcome" id="welcome">
  <p class="welcome-logo">mi<span>Collects</span></p>
  <div class="welcome-choices" id="welcomeChoices" hidden>

    <button type="button" class="btn ghost" id="wSignUp">Create account</button>
    <div class="local-row">
      <button type="button" class="link plain" id="wLocal">Use on this device only</button>
      <button type="button" class="hint-btn" id="wLocalHintBtn" aria-label="What does this mean?" aria-expanded="false">?</button>
    </div>
    <p class="hint" id="wLocalHint" hidden>Everything stays on this phone — no account needed, nothing sent to the cloud. You can export or import a backup anytime from Settings, and sign in later if you’d like it to sync automatically across devices.</p>

  <div class="welcome-form" id="welcomeForm" hidden>

    <button type="button" class="link plain" id="wfForgot" hidden>Forgot password?</button>
    <button type="button" class="link plain" id="wfBack">Back</button>

</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);

/* ---------- Storage (IndexedDB, falls back to memory) ---------- */
const store = {
  db: null, mem: new Map(),
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("cabinet", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("items", { keyPath: "id" });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
  },
  os(mode) { return this.db.transaction("items", mode).objectStore("items"); },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  /* `scope` partitions items by account: "local" for guest/offline-only items, or a signed-in user's
     uid. Passing it filters to just that partition, so switching accounts (or signing out) only ever
     shows that partition's items -- items from another scope stay stored but hidden until it's active. */
  async all(scope) {
    const items = this.db ? await this.req(this.os("readonly").getAll()) : [...this.mem.values()];
    return scope == null ? items : items.filter(i => (i.scope || "local") === scope);
  },
  async put(it) { if (!this.db) { this.mem.set(it.id, it); return; } await this.req(this.os("readwrite").put(it)); },
  async del(id) { if (!this.db) { this.mem.delete(id); return; } await this.req(this.os("readwrite").delete(id)); },
  async clear() { if (!this.db) { this.mem.clear(); return; } await this.req(this.os("readwrite").clear()); }
};

const settings = { currency: "R", layout: "grid2", sort: "recent", group: "none", geminiKey: "", onboarded: false, lastSynced: null, wishlistShareToken: null,
  firstName: "", lastName: "", phone: "", avatarUrl: "", theme: "system" };
function timeAgo(ts) {
  if (!ts) return "";
  const s = Math.max(1, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return "just now";
  const m = Math.round(s / 60); if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h} hr ago`;
  const d = Math.round(h / 24); return `${d} day${d === 1 ? "" : "s"} ago`;
}
try { Object.assign(settings, JSON.parse(localStorage.getItem("cabinet-settings") || "{}")); } catch (e) {}
/* Auto sign-out after 30 min of inactivity, for anyone signing in on a shared/borrowed device.
   "Inactivity" means time spent backgrounded (screen off, app switched away, or fully closed) --
   never while the app is open and in use, however long that session runs. Computed synchronously
   here, before first paint, so the #welcome-hiding decision below can account for it immediately --
   waiting for Firebase to resolve the restored session first is what caused the home screen to
   flash before redirecting to the sign-in screen on a stale reopen. */
const INACTIVITY_LIMIT_MS = 7 * 24 * 60 * 60 * 1000; // 7 days of backgrounded/closed inactivity before auto sign-out
const LAST_ACTIVE_KEY = "mc-last-active";
function markActive() { try { localStorage.setItem(LAST_ACTIVE_KEY, String(Date.now())); } catch (e) {} }
function markActiveAndCheckTimeout() {
  let exceeded = false;
  try {
    const last = +(localStorage.getItem(LAST_ACTIVE_KEY) || 0);
    exceeded = !!last && (Date.now() - last) > INACTIVITY_LIMIT_MS;
  } catch (e) {}
  markActive();
  return exceeded;
}
/* A background/foreground transition isn't only triggered by the user actually leaving the app --
   some Android versions fire a pause/resume blip from things like the keyboard or an autofill
   popup appearing, even mid-use. Without this, that blip gets checked against a clock that was
   last reset whenever the app was *last actually* backgrounded, which could be well before this
   active session started -- miscounting real foreground time as inactivity and signing out from
   under someone who's actively using the app. Refreshing on real taps/keystrokes keeps the clock
   current through a false blip, without ever counting idle-but-open time: the timeout is still
   only ever checked on an actual return-to-foreground (see the appStateChange listener below). */
let lastInteractionMark = 0;
function markActiveFromInteraction() {
  const now = Date.now();
  if (now - lastInteractionMark < 5000) return;
  lastInteractionMark = now;
  markActive();
}
document.addEventListener("pointerdown", markActiveFromInteraction, { passive: true });
document.addEventListener("keydown", markActiveFromInteraction);
let pendingInactivitySignOut = markActiveAndCheckTimeout();
/* "system" means no override: the prefers-color-scheme media query in the CSS takes it from there.
   Applied immediately on load (before first paint) so there's no flash of the wrong theme, and again
   whenever the user changes it in Settings. */
function applyTheme() {
  const root = document.documentElement;
  if (settings.theme === "light" || settings.theme === "dark") root.setAttribute("data-theme", settings.theme);
  else root.removeAttribute("data-theme");
}
applyTheme();
/* #welcome defaults to visible in the markup (not [hidden]) so it's the very first thing painted --
   waiting for store.open() etc. to resolve before showing it let the home screen flash underneath
   for a moment on a brand-new install. Hide it immediately, synchronously, if onboarding is already
   done; this runs before the browser has painted anything, so there's nothing left to flash. Held
   off when the inactivity timeout's already been blown, though: we don't yet know (synchronously)
   whether the restored session is a cloud account about to be force-signed-out -- hideWelcomeIfOnboarded()
   gets called once that's known, from onAuthStateChanged. */
function hideWelcomeIfOnboarded() {
  if (!settings.onboarded) return;
  const w = document.getElementById("welcome");
  if (w) w.hidden = true;
}
if (!pendingInactivitySignOut) hideWelcomeIfOnboarded();
function saveSettings() { try { localStorage.setItem("cabinet-settings", JSON.stringify(settings)); } catch (e) {} }
const nf = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });
const money = n => settings.currency + nf.format(+n || 0);
const LAYOUTS = ["grid1", "grid2", "grid3", "list"];
if (!LAYOUTS.includes(settings.layout)) settings.layout = "grid2";

/* ---------- State ---------- */
const state = { tab: "owned", q: "", cat: "All", pillField: "all", pillVal: "All", sort: settings.sort, group: settings.group, layout: settings.layout, items: [], selecting: false, selected: new Set() };
let sortOptions = [], groupOptions = [];
const PRI = { 3: "High", 2: "Medium", 1: "Low" };
const CONDITIONS = ["", "Sealed / new in box", "Mint", "Near mint", "Excellent", "Good", "Fair", "Poor"];
const RARITIES = ["", "Common", "Uncommon", "Rare", "Ultra rare", "One of a kind"];
const CHEVRON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
const STAR_PATH_D = "m12 3 2.9 5.88 6.49.94-4.7 4.58 1.11 6.47L12 17.77l-5.8 3.05 1.11-6.47-4.7-4.58 6.49-.94Z";
/* "full" >= this star's number, "half" >= half a star short of it, else "empty". */
function starState(rating, n) { return rating >= n ? "full" : rating >= n - 0.5 ? "half" : "empty"; }
function starsHtml(id, rating) {
  const r = Math.round((+rating || 0) * 2) / 2; // snap to the nearest half, defensively
  return `<div class="star-rating" id="${id}" data-value="${r}" role="radiogroup" aria-label="Rating">
    ${[1, 2, 3, 4, 5].map(n => `<button type="button" class="star-btn" data-star="${n}" data-state="${starState(r, n)}" aria-label="${n} star${n > 1 ? "s" : ""}">
      <svg class="star-outline" viewBox="0 0 24 24"><path d="${STAR_PATH_D}"/></svg>
      <svg class="star-fill" viewBox="0 0 24 24"><path d="${STAR_PATH_D}"/></svg>
    </button>`).join("")}
  </div>`;
}
function wireStars(id) {
  const el = $("#" + id);
  el.addEventListener("click", e => {
    const b = e.target.closest(".star-btn"); if (!b) return;
    const n = +b.dataset.star;
    // Left half of the star sets a half rating, right half sets a full one.
    const rect = b.getBoundingClientRect();
    const picked = (e.clientX - rect.left) < rect.width / 2 ? n - 0.5 : n;
    const current = +el.dataset.value || 0;
    const next = current === picked ? 0 : picked; // tapping the current rating again clears it
    el.dataset.value = next;
    el.querySelectorAll(".star-btn").forEach(btn => btn.setAttribute("data-state", starState(next, +btn.dataset.star)));
  });
}

/* Per-option icons for the picker sheet (Option A design). */
const ICONS = {
  recent: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg>`,
  name: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h6"/></svg>`,
  value: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5a2.5 2.5 0 0 1 2.5-1.5h1a2.5 2.5 0 0 1 0 5h-1a2.5 2.5 0 0 0 0 5h1a2.5 2.5 0 0 0 2.5-1.5"/></svg>`,
  none: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m5 5 14 14"/></svg>`,
  category: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
  brand: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.6a2 2 0 0 1-2.83 0L3 13V3h10l7.59 7.59a2 2 0 0 1 0 2.82z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>`,
  series: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg>`,
  scale: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 5 5-13 13-5-5z"/><path d="m14.5 4.5 1.5 1.5M11.5 7.5 13 9M8.5 10.5 10 12M5.5 13.5 7 15"/></svg>`,
  condition: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 9l7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>`,
  priority: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V15"/></svg>`,
  themeSystem: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>`,
  themeLight: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>`,
  themeDark: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`,
  notSet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>`,
  sealed: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/></svg>`,
  layers: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg>`,

const CONDITION_ICONS = { "": ICONS.notSet, "Sealed / new in box": ICONS.sealed, "Mint": ICONS.layers, "Near mint": ICONS.layers, "Excellent": ICONS.excellent, "Good": ICONS.good, "Fair": ICONS.fair, "Poor": ICONS.poor };
const THEME_OPTIONS = [["system", "System", ICONS.themeSystem], ["light", "Light", ICONS.themeLight], ["dark", "Dark", ICONS.themeDark]];
const price = i => i.list === "owned" ? (+i.value || 0) * (+i.qty || 1) : (+i.target || 0);
const norm = s => String(s || "").trim().toLowerCase();

const pillLabel = i => (state.pillField === "series" ? i.series : i.brand) || `No ${state.pillField}`;

function visible() {
  const q = norm(state.q);
  let list = state.items.filter(i => i.list === state.tab);
  if (state.cat !== "All") list = list.filter(i => (i.category || "Uncategorised") === state.cat);
  if (state.pillField !== "all" && state.pillVal !== "All") list = list.filter(i => pillLabel(i) === state.pillVal);
  if (q) list = list.filter(i => [i.name, i.brand, i.series, i.category, i.scale, i.description, i.notes, i.condition].join(" ").toLowerCase().includes(q));
  const by = {

    name: (a, b) => String(a.name).localeCompare(String(b.name)),
    value: (a, b) => price(b) - price(a),
    priority: (a, b) => (b.priority || 2) - (a.priority || 2) || (b.updated || 0) - (a.updated || 0)

/* ---------- Rendering ---------- */
function card(i) {
  const wish = i.list === "wish";
  const selecting = state.selecting && i.list === state.tab;
  const selected = selecting && state.selected.has(i.id);
  const first = (String(i.name || "?").trim()[0] || "?").toUpperCase();
  const ph = i.photo ? `<img src="${i.photo}" alt="" loading="lazy">` : `<span class="initial">${esc(first)}</span>`;
  const meta = [i.brand, i.series, i.category, i.scale].filter(Boolean).map(esc).join(", ");
  const p = i.priority || 2;
  const foot = wish
    ? `<span class="pri p${p}">${PRI[p]}</span><span class="val">${i.target ? money(i.target) : ""}</span>`
    : `<span>${esc(i.condition || "")}</span><span class="val">${i.value ? money(price(i)) : ""}</span>`;
  return `<div class="card${wish ? " wish" : ""}${selecting ? " selecting" : ""}${selected ? " selected" : ""}" role="button" tabindex="0" data-id="${esc(i.id)}" aria-label="${esc(i.name)}" aria-pressed="${selecting ? String(selected) : "false"}">
    <div class="ph">${selecting ? `<span class="sel-dot" aria-hidden="true"></span>` : ""}${ph}${!wish && +i.qty > 1 ? `<span class="qty">×${+i.qty}</span>` : ""}</div>
    <div class="cb">

const UNGROUPED = /^(uncategorised|no brand|no series|no size|not set)$/i;
function groupLabel(i, g) {
  if (g === "category") return i.category || "Uncategorised";
  if (g === "brand") return i.brand || "No brand";
  if (g === "series") return i.series || "No series";
  if (g === "scale") return i.scale || "No size";
  if (g === "condition") return i.condition || "Not set";
  if (g === "priority") return PRI[i.priority || 2] || "Medium";
  if (g === "name") { const c = (String(i.name || "").trim()[0] || "").toUpperCase(); return /[A-Z]/.test(c) ? c : "#"; }
  return "";
}
function groupedHtml(list, g) {
  const buckets = new Map();
  for (const i of list) { const k = groupLabel(i, g); if (!buckets.has(k)) buckets.set(k, []); buckets.get(k).push(i); }
  let keys = [...buckets.keys()];
  if (g === "priority") { const rank = { High: 0, Medium: 1, Low: 2 }; keys.sort((a, b) => (rank[a] ?? 9) - (rank[b] ?? 9)); }
  else keys.sort((a, b) => (UNGROUPED.test(a) || a === "#") === (UNGROUPED.test(b) || b === "#")
    ? a.localeCompare(b) : (UNGROUPED.test(a) || a === "#") ? 1 : -1);
  return keys.map(k => `<h2 class="group-head">${esc(k)}<span class="group-count">${buckets.get(k).length}</span></h2>${buckets.get(k).map(card).join("")}`).join("");
}

/* ---------- Sheet (Android back button closes it) ---------- */
let sheetOpen = false;
function showSheet() {
  $("#scrim").hidden = false; $("#sheet").hidden = false; $("#sheet").scrollTop = 0;
  document.body.style.overflow = "hidden";
  if (!sheetOpen) { sheetOpen = true; try { history.pushState({ sheet: 1 }, ""); } catch (e) {} }
  const h = $("#sheetTitle"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
}
function hideSheet() {
  $("#scrim").hidden = true; $("#sheet").hidden = true; document.body.style.overflow = "";
  sheetOpen = false;
}
/* Set right before any programmatic history.back() that closes something we've already handled
   synchronously (hideSheet/exitSelectMode/hidePicker already ran) -- popstate fires later/async, and
   without this the handler below can't tell that apart from a real back-navigation, so it falls
   through to closing whatever's still open underneath (e.g. picking a Theme option, nested inside
   the open Settings sheet, was incorrectly closing Settings too). */
let suppressNextPopstate = false;
function closeSheet() {
  if (!sheetOpen) return;
  hideSheet();
  try { if (history.state && history.state.sheet) { suppressNextPopstate = true; history.back(); } } catch (e) {}
}

/* Multi-select (long-press only) also pushes a history entry on entry, the same way showSheet()
   does -- so the hardware/gesture back button exits it instead of closing the app, with no
   on-screen Cancel button needed. Share and Delete are both available at once, side by side, once
   in this mode -- there's no separate mode per action. exitSelectModeAndPop() is for exiting
   programmatically (e.g. after a successful delete/share): it resets state AND consumes the pushed
   entry via history.back() so the stack stays balanced either way the mode gets exited. */
function enterSelectMode(ids) {
  state.selecting = true; state.selected = new Set(ids || []);
  try { history.pushState({ select: 1 }, ""); } catch (e) {}
  render();
}
function exitSelectMode() {
  if (!state.selecting) return;
  state.selecting = false; state.selected = new Set();
  render();
}
function exitSelectModeAndPop() {
  if (!state.selecting) return;
  exitSelectMode();
  try { if (history.state && history.state.select) { suppressNextPopstate = true; history.back(); } } catch (e) {}
}

/* ---------- Picker (replaces native <select> option lists with an in-app styled sheet --
   Android's native picker dialog can't be restyled via CSS, since it's OS chrome, not page
   content.) Options are [value, label, iconSvg?] tuples; onSelect gets the chosen value as a
   string. A generic dot icon is used for any option that doesn't supply its own. */
const PICKER_DEFAULT_ICON = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>`;
let pickerOpen = false;
let pickerOnCancel = null;
/* onCancel (optional, 5th arg) fires once if the picker is dismissed without a selection -- via the
   scrim or the back button -- for callers like pickPhotoSource() below that need to know "nothing
   was chosen" rather than just leaving a setting unchanged. */
function openPicker(title, options, selectedValue, onSelect, onCancel) {
  pickerOnCancel = onCancel || null;
  $("#pickerTitle").textContent = title;
  $("#pickerOptions").innerHTML = options.map(([v, l, icon]) => `
    <button type="button" class="picker-opt" role="radio" aria-checked="${String(v) === String(selectedValue)}" data-value="${esc(v)}">
      <span class="ic" aria-hidden="true">${icon || PICKER_DEFAULT_ICON}</span>
      <span class="lbl">${esc(l)}</span>
      <svg class="check" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </button>`).join("");
  $("#pickerOptions").onclick = e => {
    const b = e.target.closest(".picker-opt"); if (!b) return;
    pickerOnCancel = null;
    closePicker();
    onSelect(b.dataset.value);
  };

  if (!pickerOpen) { pickerOpen = true; try { history.pushState({ picker: 1 }, ""); } catch (e) {} }
}
function hidePicker() {
  $("#pickerScrim").hidden = true; $("#pickerSheetEl").hidden = true;
  pickerOpen = false;
  if (pickerOnCancel) { const cb = pickerOnCancel; pickerOnCancel = null; cb(); }
}
function closePicker() {
  if (!pickerOpen) return;
  hidePicker();
  try { if (history.state && history.state.picker) { suppressNextPopstate = true; history.back(); } } catch (e) {}
}

addEventListener("popstate", () => {
  if (suppressNextPopstate) { suppressNextPopstate = false; return; }
  if (pickerOpen) { hidePicker(); return; }
  // sheetOpen before selecting: the bulk-update sheet opens on top of an active select-mode
  // session, so it's always the topmost thing when both are open -- back must close it first.
  if (sheetOpen) { hideSheet(); return; }
  if (state.selecting) exitSelectMode();
});
$("#scrim").addEventListener("click", closeSheet);
$("#pickerScrim").addEventListener("click", closePicker);
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (pickerOpen) { closePicker(); return; }
  if (state.selecting) { exitSelectModeAndPop(); return; }
  closeSheet();
});

/* Installing a backButton listener hands Capacitor's hardware-back handling to us: without one it
   just exits the app. Closing the sheet/exiting select mode via history.back() reuses the popstate
   handler above. */
(() => {
  const P = window.Capacitor && window.Capacitor.Plugins;
  if (!P || !P.App) return;
  P.App.addListener("backButton", ({ canGoBack }) => {
    if (canGoBack) history.back(); else P.App.exitApp();
  });
  /* Going to background (screen lock included) just marks when the inactivity clock started.
     Coming back to foreground is the only moment that clock actually gets checked -- this is what
     makes the 30-min sign-out work for a long-lived process that's locked/unlocked repeatedly
     without ever being fully closed, which a blind markActive() on every transition can't do: it
     would reset the clock on the very same unlock event that's supposed to be checking it. */
  P.App.addListener("appStateChange", ({ isActive }) => {
    if (!isActive) { markActive(); return; }
    if (markActiveAndCheckTimeout() && cloudUser) { forceWelcomeNext = true; fbAuth.signOut().catch(() => {}); }
  });
})();

/* ---------- Photos ---------- */
function compressSrc(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => rej(new Error("That file isn’t an image the app can read."));
    img.src = src;
  });
}
function compress(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => compressSrc(r.result).then(res, rej);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}

/* ---------- Add using URL ---------- */
const UA = "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
/* Calls the CapacitorHttp plugin's methods directly (bypassing CORS for scraping shop pages/images and
   calling Gemini) rather than enabling CapacitorHttp's global fetch/XMLHttpRequest patch in
   capacitor.config.json -- that patch also intercepts Firebase's own SDK calls and breaks Storage
   uploads ("storage/unknown"), since Firebase's upload protocol doesn't survive being proxied through it. */
const nativeHttp = () => {
  const C = window.Capacitor;
  return C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.CapacitorHttp ? C.Plugins.CapacitorHttp : null;
};
/* Strips trailing punctuation that's almost never actually part of a URL when pasted at the end of a
   sentence (a period, a closing bracket with no matching opener inside the URL, etc.). */
function trimUrlPunct(u) {
  let prev;
  do {
    prev = u;
    u = u.replace(/[.,;:!?'"]+$/, "");
    if (/\)$/.test(u) && (u.match(/\(/g) || []).length < (u.match(/\)/g) || []).length) u = u.slice(0, -1);
    if (/\]$/.test(u) && (u.match(/\[/g) || []).length < (u.match(/\]/g) || []).length) u = u.slice(0, -1);
  } while (u !== prev);
  return u;
}
/* Shared/copied links often come with surrounding text ("Check this out: https://... Price varies"
   from Checkers, Pick n Pay ASAP!, etc.) -- pull out just the URL instead of requiring a clean paste. */
const normUrl = s => {
  s = String(s || "").trim(); if (!s) return "";
  const m = s.match(/https?:\/\/[^\s<>"']+/i);
  s = m ? trimUrlPunct(m[0]) : s;
  if (!/^https?:\/\//i.test(s)) s = "https://" + s;
  try { const u = new URL(s); return /^https?:$/.test(u.protocol) ? u.href : ""; } catch (e) { return ""; }
};
const parsePrice = s => {
  if (s == null) return null;
  let t = String(s).replace(/[^\d.,]/g, ""); if (!t) return null;
  if (t.includes(",") && t.includes(".")) t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  else if (t.includes(",")) t = /,\d{1,2}$/.test(t) ? t.replace(",", ".") : t.replace(/,/g, "");
  const n = parseFloat(t); return isFinite(n) ? n : null;
};
const SYMBOLS = { ZAR: "R", USD: "$", EUR: "€", GBP: "£", JPY: "¥", AUD: "A$", CAD: "C$", NZD: "NZ$", INR: "₹", CNY: "¥" };
const listJoin = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];

async function fetchPage(url) {
  const H = nativeHttp();
  if (H) {
    const r = await H.get({ url, responseType: "text", connectTimeout: 15000, readTimeout: 15000,
      headers: { "User-Agent": UA, "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8", "Accept-Language": "en-ZA,en;q=0.9" } });
    if (r.status >= 400) throw Object.assign(new Error("status"), { status: r.status });
    return { html: typeof r.data === "string" ? r.data : JSON.stringify(r.data), finalUrl: r.url || url };
  }
  const r = await fetch(url, { credentials: "omit" });
  if (!r.ok) throw Object.assign(new Error("status"), { status: r.status });
  return { html: await r.text(), finalUrl: r.url || url };
}

async function fetchImage(src) {
  const H = nativeHttp();
  if (H) {
    const r = await H.get({ url: src, responseType: "blob", connectTimeout: 15000, readTimeout: 20000,
      headers: { "User-Agent": UA, "Accept": "image/avif,image/webp,image/*,*/*;q=0.8" } });
    if (r.status >= 400 || !r.data) throw Object.assign(new Error(`image fetch failed (HTTP ${r.status})`), { status: r.status });
    const h = r.headers || {};
    const ct = String(h["Content-Type"] || h["content-type"] || "image/jpeg").split(";")[0];
    return compressSrc(`data:${ct};base64,${r.data}`);
  }
  const r = await fetch(src, { credentials: "omit" });
  if (!r.ok) throw Object.assign(new Error(`image fetch failed (HTTP ${r.status})`), { status: r.status });
  return compress(await r.blob());
}

/* ---------- Add using photos (Gemini vision) ---------- */
const CAM_MAX = 3;
const GEMINI_PROMPT = "You are helping catalog a physical collectible (e.g. a diecast car, action figure, trading "
  + "card, comic, toy, model kit) from photos someone just took of their own item. There may be up to three photos: "
  + "typically the item itself, then the back of it, then a price tag or receipt — but treat them as photos of the "
  + "same single item regardless of what each one shows. Identify the item as specifically as you can, and read any "
  + "price tag or sticker if one is visible. Reply with ONLY a compact JSON object (no markdown, no commentary) with "
  + "exactly these keys: name (the specific product/item name, without the brand), brand (manufacturer or brand "
  + "name, empty string if unclear), category (a short general category like \"Diecast Cars\", \"Trading Cards\" or "
  + "\"Action Figures\", empty string if unclear), description (one short sentence describing it), price (the "
  + "numeric price read from a tag/sticker/receipt if one of the photos shows one, otherwise null — a number only, "
  + "no currency symbol), search (a short, specific phrase someone could use to search for a clean product photo of "
  + "this exact item online, combining brand and name). If you cannot identify the item at all, return the text "
  + "fields as empty strings and price as null.";

async function recognizePhotos(base64s) {
  const key = (settings.geminiKey || "").trim();
  if (!key) throw Object.assign(new Error("No Gemini API key set"), { code: "no-key" });
  /* Google retires Gemini model names on a rolling schedule (gemini-2.0-flash shut down, gemini-2.5-flash is next,
     per ai.google.dev/gemini-api/docs/models) — if this starts 404ing again, that page names the current stable
     multimodal "flash" model to swap in here. */
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(key)}`;
  const body = JSON.stringify({
    contents: [{ parts: [{ text: GEMINI_PROMPT }, ...base64s.map(data => ({ inline_data: { mime_type: "image/jpeg", data } }))] }],
    generationConfig: { responseMimeType: "application/json" }
  });
  const H = nativeHttp();
  let data;
  if (H) {
    const r = await H.post({ url, headers: { "Content-Type": "application/json" }, data: body, connectTimeout: 20000, readTimeout: 30000 });
    if (r.status >= 400) throw Object.assign(new Error("status"), { status: r.status });
    data = typeof r.data === "string" ? JSON.parse(r.data) : r.data;
  } else {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body });
    if (!r.ok) throw Object.assign(new Error("status"), { status: r.status });
    data = await r.json();
  }
  const parts = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  const raw = parts.map(p => p.text || "").join("").trim().replace(/^```(?:json)?\s*|\s*```$/g, "");
  if (!raw) throw new Error("empty");
  const parsed = JSON.parse(raw);
  const str = v => String(v ?? "").trim();
  return {
    name: str(parsed.name), brand: str(parsed.brand), category: str(parsed.category),
    description: str(parsed.description).slice(0, 1500), search: str(parsed.search),
    price: parsePrice(parsed.price)
  };
}

/* One photo per tap (cover photo first, then back/price-tag shots appended), up to CAM_MAX;
   recognition runs on demand across every photo taken in this batch. */
/* Capacitor's Camera.getPhoto({source:"PROMPT"}) shows its own native "Photo / From Photos / Take
   Picture" action sheet -- OS chrome, not page content, so (like the native <select> pickers
   replaced elsewhere) it can't be restyled. This asks with our own picker sheet instead, then
   calls getPhoto with an explicit source so the native prompt never appears. Resolves to "CAMERA"
   or "PHOTOS", or null if dismissed without a choice. */
function pickPhotoSource() {
  return new Promise(resolve => {
    openPicker("Add a photo", [
      ["CAMERA", "Take a photo", ICONS.camera],
      ["PHOTOS", "Choose from gallery", ICONS.gallery]
    ], null, resolve, () => resolve(null));
  });
}
function wireCamera(it, paintPhotos, dup) {
  const camBatch = [];
  const btn = $("#camBtn"), doneBtn = $("#camDoneBtn"), hint = $("#camHint");
  const show = msg => { hint.hidden = false; hint.textContent = msg; };

  btn.addEventListener("click", async () => {
    const P = window.Capacitor && window.Capacitor.Plugins;
    if (!P || !P.Camera) { show("Adding a photo only works in the Android app, not this preview."); return; }
    const source = await pickPhotoSource();
    if (!source) return;
    btn.disabled = true;
    try {
      const shot = await P.Camera.getPhoto({ quality: 80, resultType: "base64", source, saveToGallery: false });
      if (!shot || !shot.base64String) return;
      let compressed;
      try { compressed = await compressSrc(`data:image/${shot.format || "jpeg"};base64,${shot.base64String}`); }
      catch (e) { show(e.message || "That photo couldn’t be used."); return; }
      if (camBatch.length === 0) photos.unshift(compressed); else if (photos.length < MAXP) photos.push(compressed);
      camBatch.push(compressed);
      paintPhotos();
      doneBtn.hidden = false; doneBtn.disabled = false; doneBtn.textContent = "Recognise photos";
      if (camBatch.length >= CAM_MAX) { btn.hidden = true; show(`Photo ${camBatch.length} of ${CAM_MAX} added. Tap Recognise to fill in the details.`); }
      else { btn.textContent = "Add Another Photo"; show(`Photo ${camBatch.length} of ${CAM_MAX} added — add the back or a price tag, or tap Recognise to fill in details now.`); }
    } catch (e) { if (!/cancel/i.test(String(e && e.message))) show("Couldn’t get that photo."); }
    finally { btn.disabled = false; }
  });

  doneBtn.addEventListener("click", async () => {
    if (!camBatch.length) return;
    if (!(settings.geminiKey || "").trim()) { show("Add a free Gemini API key in Settings to auto-fill the details from your photos."); return; }
    btn.disabled = true; doneBtn.disabled = true; doneBtn.textContent = "Recognising…"; show("Looking at the photos…");
    try {
      const d = await recognizePhotos(camBatch.map(p => p.split(",")[1]));
      const set = (id, v) => { const el = document.getElementById(id); if (el && v) { el.value = v; el.dispatchEvent(new Event("input")); } };
      set("f-name", d.name); set("f-brand", d.brand); set("f-cat", d.category); set("f-desc", d.description);
      if (d.price != null) { if (it.list === "owned") { set("f-paid", d.price); set("f-value", d.price); } else set("f-target", d.price); }
      dup();
      const filled = [d.name && "name", d.brand && "brand", d.category && "category", d.description && "description", d.price != null && "price"].filter(Boolean);
      if (!filled.length) { show("Couldn’t make out what this is from the photos. Fill in the details yourself."); doneBtn.disabled = false; doneBtn.textContent = "Recognise photos"; return; }
      btn.hidden = true; doneBtn.hidden = true;
      hint.hidden = false;
      hint.innerHTML = `Filled in ${esc(listJoin(filled))} from your photos. Check the details, then save.`
        + (d.search ? ` <a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(d.search)}" target="_blank" rel="noopener">Search for a clean photo online</a> if you’d rather use one — paste its page link above and tap Fetch.` : "");
    } catch (e) {
      show(e && e.code === "no-key" ? "Add a free Gemini API key in Settings to auto-fill the details from your photos."
        : e && e.status === 404 ? "The recognition model isn’t available any more (Google retired it) — this needs a code update."
        : e && e.status === 400 ? "The recognition service rejected the API key. Check it in Settings."
        : e && e.status ? `The recognition service refused the request (error ${e.status}).`
        : "Couldn’t reach the recognition service. Check your connection.");
      doneBtn.disabled = false; doneBtn.textContent = "Recognise photos";
    } finally { btn.disabled = false; }
  });
}

/* Reads product data from structured data (JSON-LD), Open Graph and microdata tags. */
function extractProduct(html, pageUrl) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const abs = u => { try { return new URL(String(u).trim(), pageUrl).href; } catch (e) { return ""; } };
  const sel = k => `meta[property="${k}"],meta[name="${k}"],meta[itemprop="${k}"]`;
  const meta = (...keys) => { for (const k of keys) { const el = doc.querySelector(sel(k)); const c = el && el.getAttribute("content"); if (c && c.trim()) return c.trim(); } return ""; };
  const metaAll = k => [...doc.querySelectorAll(sel(k))].map(m => m.getAttribute("content")).filter(Boolean);
  const itemprop = k => { const el = doc.querySelector(`[itemprop="${k}"]`); return el ? (el.getAttribute("content") || el.textContent || "").trim() : ""; };
  const text = s => { if (s == null || s === "") return ""; const d = new DOMParser().parseFromString(String(s), "text/html"); return (d.body.textContent || "").replace(/\s+/g, " ").trim(); };
  const firstLine = s => {
    if (s == null || s === "") return "";
    const d = new DOMParser().parseFromString(String(s), "text/html");
    const lines = (d.body.textContent || "").split(/\r?\n+/).map(x => x.replace(/\s+/g, " ").trim()).filter(Boolean);
    return lines[0] || "";
  };
  const nameOf = v => !v ? "" : typeof v === "string" ? v : Array.isArray(v) ? nameOf(v[0]) : String(v.name || "");
  const types = n => [].concat((n && n["@type"]) || []).map(String);

  const nodes = [];
  const walk = n => {
    if (!n || typeof n !== "object") return;
    if (Array.isArray(n)) { n.forEach(walk); return; }
    nodes.push(n);
    if (n["@graph"]) walk(n["@graph"]);
    if (n.mainEntity) walk(n.mainEntity);
  };
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(s => {
    const raw = s.textContent.trim();
    try { walk(JSON.parse(raw)); }
    catch (e) {
      /* Some storefronts inject stray markup into this block, which breaks JSON.parse; strip tags and retry. */
      try { walk(JSON.parse(raw.replace(/<[^>]*>/g, ""))); } catch (e2) {}
    }
  });
  const product = nodes.find(n => types(n).some(t => /^(Product|ProductGroup|IndividualProduct|ProductModel|Book)$/i.test(t))) || {};
  const crumbs = nodes.find(n => types(n).includes("BreadcrumbList"));

  let name = text(product.name);
  if (!name) {
    name = text(meta("og:title", "twitter:title") || doc.title);
    const parts = name.split(/\s+[|–—-]\s+/);
    if (parts.length > 1 && parts[0].length > 3) name = parts[0];
  }
  const description = (firstLine(product.description) || text(meta("og:description", "description", "twitter:description"))).slice(0, 1500);
  const brand = text(nameOf(product.brand) || nameOf(product.manufacturer) || meta("product:brand", "og:brand", "brand") || itemprop("brand"));

  let category = text(nameOf(product.category) || meta("product:category", "og:category", "category"));
  if (/[>/]/.test(category)) category = category.split(/\s*[>/]\s*/).filter(Boolean).pop() || "";
  if (!category) {
    let items = [];
    if (crumbs) {
      items = [].concat(crumbs.itemListElement || [])
        .sort((a, b) => (+a.position || 0) - (+b.position || 0))
        .map(i => text((i.item && typeof i.item === "object" ? i.item.name : "") || i.name || ""));
    }
    if (!items.length) {
      const nav = doc.querySelector('nav[aria-label="breadcrumb" i], nav[aria-label="breadcrumbs" i], ol.breadcrumb, ul.breadcrumb, .breadcrumbs, [itemtype*="BreadcrumbList" i]');
      if (nav) items = [...nav.querySelectorAll("li")].map(li => text(li.textContent));
    }
    items = items.filter(n => n && !/^home$/i.test(n));
    if (items.length) {
      const last = items[items.length - 1];
      category = norm(last) === norm(name) && items.length > 1 ? items[items.length - 2] : last;
    }
  }

  /* Strip a leading "Brand - " from the title only once the breadcrumb/category match above has run,
     since storefronts often repeat the untouched title as the final breadcrumb crumb. */
  if (brand) {
    const safeBrand = brand.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    name = name.replace(new RegExp(`^\\s*${safeBrand}\\s*[:\\-–—|]\\s*`, "i"), "").trim() || name;
  }

  let price = null, currency = "";
  const offers = [].concat(product.offers || []);
  for (const o of offers) {
    if (!o || typeof o !== "object") continue;
    const spec = [].concat(o.priceSpecification || [])[0] || {};
    const p = parsePrice(o.price ?? o.lowPrice ?? spec.price);
    if (p != null) { price = p; currency = o.priceCurrency || spec.priceCurrency || ""; break; }
    if (o.offers) offers.push(...[].concat(o.offers));
  }
  if (price == null) {
    const p = parsePrice(meta("product:price:amount", "og:price:amount", "price") || itemprop("price"));
    if (p != null) { price = p; currency = meta("product:price:currency", "og:price:currency", "priceCurrency") || itemprop("priceCurrency"); }
  }

  const images = [];
  const addImg = v => {
    if (!v) return;
    if (Array.isArray(v)) { v.forEach(addImg); return; }
    if (typeof v === "object") { addImg(v.contentUrl || v.url || v.thumbnailUrl); return; }
    const u = abs(v);
    if (/^https?:/i.test(u) && !images.includes(u)) images.push(u);
  };
  addImg(product.image);
  ["og:image", "og:image:secure_url", "og:image:url", "twitter:image"].forEach(k => metaAll(k).forEach(addImg));
  doc.querySelectorAll('[itemprop="image"]').forEach(el => addImg(el.getAttribute("content") || el.getAttribute("src") || el.getAttribute("href")));
  const lis = doc.querySelector('link[rel="image_src"]'); if (lis) addImg(lis.getAttribute("href"));

  /* Listings are assumed new/sealed unless the page itself says otherwise. */
  const usedHints = /\b(pre[- ]?owned|second[- ]?hand|used|refurbished|open box|no box|loose|as[- ]?is|previously owned|display(?:ed)? only)\b/i;
  const condition = usedHints.test(`${product.name || ""} ${product.description || ""} ${name} ${description}`) ? "" : "Sealed / new in box";

  return { name, description, brand, category, condition, price, currency: String(currency || "").toUpperCase(), images: images.slice(0, MAXP) };
}

async function fillFromUrl(it, paintPhotos, dup) {
  const input = $("#f-url"), btn = $("#urlBtn"), hint = $("#urlHint");
  const url = normUrl(input.value);
  if (!url) { hint.textContent = "That doesn’t look like a web link. It should start with https://"; input.focus(); return; }
  input.value = url; input.dispatchEvent(new Event("input"));
  const purlInput = $("#f-producturl");
  purlInput.value = url; purlInput.dispatchEvent(new Event("input"));
  btn.disabled = true; btn.textContent = "Fetching…"; hint.textContent = "Reading the page…";
  try {
    let page;
    try { page = await fetchPage(url); }
    catch (e) {
      hint.textContent = !nativeHttp()
        ? "This preview can’t reach other websites. Add using URL works in the Android app."
        : e.status ? `The site refused the request (error ${e.status}). Some shops block apps, so fill in the details yourself.`
        : "Couldn’t reach that page. Check the link and your connection.";
      return;
    }
    const d = extractProduct(page.html, page.finalUrl);
    const set = (id, v) => { const el = document.getElementById(id); if (el && v != null && v !== "") { el.value = v; el.dispatchEvent(new Event("input")); } };
    set("f-name", d.name); set("f-brand", d.brand); set("f-cat", d.category); set("f-desc", d.description); set("f-cond", d.condition);
    if (d.price != null) {
      if (it.list === "owned") { set("f-paid", d.price); set("f-value", d.price); } else set("f-target", d.price);
    }
    let notedUrl = false;
    const notesEl = $("#f-notes");
    if (notesEl && !notesEl.value.trim()) {
      notesEl.value = (it.list === "owned" ? "Bought from: " : "Found at: ") + url;
      notesEl.dispatchEvent(new Event("input"));
      notedUrl = true;
    }
    let got = 0;
    if (d.images.length) hint.textContent = "Getting photos…";
    for (const src of d.images) {
      if (photos.length >= MAXP) break;
      try { const p = await fetchImage(src); if (!photos.includes(p)) { photos.push(p); got++; } } catch (e) {}
    }
    paintPhotos(); dup();
    const filled = [d.name && "name", d.brand && "brand", d.category && "category", d.description && "description",
      d.condition && "condition", d.price != null && "price", notedUrl && "notes", got && `${got} ${got === 1 ? "photo" : "photos"}`].filter(Boolean);
    let msg = filled.length ? `Filled in ${listJoin(filled)}. Check the details, then save.` : "Couldn’t find product details on that page. Fill them in yourself.";
    if (d.price != null && d.currency && SYMBOLS[d.currency] !== settings.currency.trim()) msg += ` The price is in ${d.currency}.`;
    hint.textContent = msg;
  } finally {
    btn.disabled = false; btn.textContent = "Fetch";
  }
}

/* ---------- Item form ---------- */
let editing = null, photos = [];
let settingsTab = "account", authMode = null;
const MAXP = 8;

/* Scrolls a too-long placeholder left-to-right and resets, so it stays fully readable in a narrow
   box (e.g. the Size field's "Scale, size, no. of pieces, etc."). Native ::placeholder can't be
   reliably transform-animated across engines, so this draws its own overlay text instead -- hidden
   the moment there's a real value, exactly like a native placeholder, and only actually animated if
   the text turns out wider than the box once rendered. Call after addClearButtons/wireSuggest have
   run on the same root, since it reads the input's *current* parent (its .clearable wrapper, if any)
   to position the overlay. */
function wirePlaceholderMarquee(inputId) {
  const input = document.getElementById(inputId); if (!input) return;
  const text = input.getAttribute("placeholder"); if (!text) return;
  input.classList.add("has-marquee");
  const host = input.parentNode;
  if (getComputedStyle(host).position === "static") host.style.position = "relative";
  const ph = document.createElement("span");
  ph.className = "ph-text"; ph.setAttribute("aria-hidden", "true");
  ph.innerHTML = `<span class="ph-run">${esc(text)}</span>`;
  host.insertBefore(ph, input.nextSibling);
  const run = ph.querySelector(".ph-run");
  const sync = () => { ph.hidden = !!input.value; };
  input.addEventListener("input", sync); sync();
  requestAnimationFrame(() => {
    const dist = run.scrollWidth - (input.clientWidth - 24); // 24 ~= the input's own left+right padding
    if (dist > 4) { run.style.setProperty("--ph-dist", `-${dist}px`); run.classList.add("ph-scroll"); }
  });
}

/* Adds a tappable "x" to every plain text-ish input/textarea inside `root` that doesn't already
   have one, clearing that field instead of having to select-all and delete manually. Safe to call
   repeatedly/on overlapping roots -- already-wrapped fields are skipped. */
function addClearButtons(root) {
  root.querySelectorAll('input[type="text"], input[type="email"], input[type="password"], input[type="search"], input[type="url"], input:not([type]), textarea').forEach(field => {
    if (field.closest(".clearable") || field.dataset.noClear != null) return;
    const wrap = document.createElement("div");
    wrap.className = "clearable" + (field.tagName === "TEXTAREA" ? " ta" : "");
    field.parentNode.insertBefore(wrap, field);
    wrap.appendChild(field);
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "clear-btn"; btn.setAttribute("aria-label", "Clear"); btn.tabIndex = -1; btn.textContent = "×";
    wrap.appendChild(btn);
    const sync = () => { btn.hidden = !field.value; };
    field.addEventListener("input", sync); sync();
    btn.addEventListener("mousedown", e => e.preventDefault());
    btn.addEventListener("click", () => { field.value = ""; field.dispatchEvent(new Event("input", { bubbles: true })); field.focus(); });
  });
}

const EYE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_OFF_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 7 11 7a18.6 18.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

/* Adds a show/hide "eye" toggle to every password field inside `root` -- run after addClearButtons
   so it reuses the same wrapper, sitting just left of the clear button. Safe to call repeatedly/on
   overlapping roots -- already-toggled fields are skipped. */
function addPasswordToggles(root) {
  root.querySelectorAll('input[type="password"]').forEach(field => {
    if (field.dataset.pwToggle != null) return;
    field.dataset.pwToggle = "1";
    let wrap = field.closest(".clearable");
    if (!wrap) {
      wrap = document.createElement("div");
      wrap.className = "clearable";
      field.parentNode.insertBefore(wrap, field);
      wrap.appendChild(field);
    }
    wrap.classList.add("has-pw");
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "pw-toggle"; btn.tabIndex = -1;
    btn.setAttribute("aria-label", "Show password"); btn.innerHTML = EYE_ICON;
    wrap.appendChild(btn);
    btn.addEventListener("mousedown", e => e.preventDefault());
    btn.addEventListener("click", () => {
      const showing = field.type === "text";
      field.type = showing ? "password" : "text";
      btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      btn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
      field.focus();
    });
  });
}

/* Custom suggestion dropdown shared by Category/Series/Brand/Scale (not a native <datalist>:
   Android WebView mispositions its popup when the input sits inside this scrolling, animated
   bottom sheet). `values` is the full list of distinct previously-used values for that field. */
function wireSuggest(inputId, listId, values) {
  const input = $("#" + inputId), list = $("#" + listId);
  let active = -1;
  const close = () => { list.hidden = true; list.innerHTML = ""; active = -1; input.setAttribute("aria-expanded", "false"); };
  const open = () => {
    const q = norm(input.value);
    const matches = values.filter(c => norm(c).includes(q) && norm(c) !== q).slice(0, 8);
    if (!matches.length) { close(); return; }
    list.innerHTML = matches.map(c => `<li>${esc(c)}</li>`).join("");
    list.hidden = false; active = -1; input.setAttribute("aria-expanded", "true");
  };
  input.addEventListener("input", open);
  input.addEventListener("focus", open);
  input.addEventListener("blur", () => setTimeout(close, 150));
  list.addEventListener("mousedown", e => {
    const li = e.target.closest("li"); if (!li) return;
    e.preventDefault();
    input.value = li.textContent; close();
  });
  input.addEventListener("keydown", e => {
    if (list.hidden) return;
    const items = [...list.children];
    if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(items.length - 1, active + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, active - 1); }
    else if (e.key === "Enter" && active >= 0) { e.preventDefault(); input.value = items[active].textContent; close(); return; }
    else if (e.key === "Escape") { close(); return; }
    else return;
    items.forEach((li, i) => li.classList.toggle("active", i === active));
  });
}

function openForm(item, convertTo) {
  const isNew = !item;
  const it = item ? { ...item } : { id: uid(), list: state.tab, qty: 1, priority: 2, created: Date.now() };
  if (convertTo === "owned") {
    it.list = "owned"; it.qty = it.qty || 1;
