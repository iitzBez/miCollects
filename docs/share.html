<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<title>Wishlist · miCollects</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--sunk:#F1F4F8;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --brass:#2563EB;--danger:#DC2626;
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0F141C;--surface:#171D27;--sunk:#1F2632;--ink:#F1F5F9;--muted:#94A3B8;--line:#2A3342;--brass:#3B82F6;--danger:#F87171;color-scheme:dark; }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
img{max-width:100%;display:block}
.wrap{max-width:880px;margin:0 auto;padding:28px 16px 48px}
header{margin-bottom:22px}
h1{font:800 clamp(26px,7vw,34px)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 6px}
header p{margin:0;color:var(--muted);font-size:14px}
#status{padding:40px 16px;text-align:center;color:var(--muted)}
#status[hidden],#grid[hidden]{display:none}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:var(--sunk);display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover}
.noph{width:40%;height:40%;border-radius:50%;background:var(--line)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{margin:0;font:700 16px/1.3 var(--display);letter-spacing:-.01em}
.meta{margin:0;color:var(--muted);font-size:13px}
.desc{margin:4px 0 0;font-size:13px;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pri{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pri.p3{background:rgba(220,38,38,.12);color:var(--danger)}
.pri.p2{background:rgba(37,99,235,.12);color:var(--brass)}
.price{font:800 15px/1 var(--display);color:var(--ink)}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:12px}
footer span{color:var(--brass);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎁 Wishlist</h1>
    <p>Here’s what’s on the list — view only, no account or app needed.</p>
  </header>
  <div id="status">Loading wishlist…</div>
  <div id="grid" hidden></div>
  <footer>Shared via <span>miCollects</span></footer>
</div>

<script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore-compat.js"></script>
<script>
/* Public web config -- not secret; access is controlled by Firestore security rules, not by hiding this. */
const firebaseConfig = {
  apiKey: "AIzaSyBiTKFRbf8d2npi3YOcOGM5a-8Vrjo_LXs",
  authDomain: "micollects.firebaseapp.com",
  projectId: "micollects",
  storageBucket: "micollects.firebasestorage.app",
  messagingSenderId: "685369410685",
  appId: "1:685369410685:web:a7812c04ba3b2215a51d14"
};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PRI = { 3: "High priority", 2: "Medium priority", 1: "Low priority" };
const nf = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });

const statusEl = document.getElementById("status");
const gridEl = document.getElementById("grid");
function showStatus(msg) { statusEl.hidden = false; statusEl.textContent = msg; gridEl.hidden = true; }

function cardHtml(it, currency) {
  const meta = [it.brand, it.category, it.scale].filter(Boolean).join(" · ");
  const price = it.target != null && it.target !== "" ? `${currency}${nf.format(+it.target || 0)}` : "";
  return `<div class="card">
    <div class="ph">${it.photo ? `<img src="${esc(it.photo)}" alt="" loading="lazy">` : `<div class="noph"></div>`}</div>
    <div class="body">
      <h3>${esc(it.name || "Untitled")}</h3>
      ${meta ? `<p class="meta">${esc(meta)}</p>` : ""}
      ${it.description ? `<p class="desc">${esc(it.description)}</p>` : ""}
      <div class="foot">
        <span class="pri p${it.priority || 2}">${esc(PRI[it.priority || 2] || "Medium priority")}</span>
        ${price ? `<span class="price">${esc(price)}</span>` : ""}
      </div>
    </div>
  </div>`;
}

async function main() {
  const token = new URLSearchParams(location.search).get("id");
  if (!token) { showStatus("No wishlist link given."); return; }
  try {
    firebase.initializeApp(firebaseConfig);
    const snap = await firebase.firestore().collection("shares").doc(token).get();
    if (!snap.exists) { showStatus("This wishlist link isn’t available. It may have been turned off."); return; }
    const data = snap.data() || {};
    const items = Array.isArray(data.items) ? data.items : [];
    if (!items.length) { showStatus("This wishlist is empty right now."); return; }
    gridEl.innerHTML = items.map(it => cardHtml(it, data.currency || "")).join("");
    statusEl.hidden = true; gridEl.hidden = false;
  } catch (e) {
    showStatus("Couldn’t load this wishlist. Check your connection and try again.");
  }
}
main();
</script>
</body>
</html>
